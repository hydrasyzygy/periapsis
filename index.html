<style>
:root {
  --bone: #ECE5D6;
  --bone-2: rgba(236, 229, 214, .74);
  --bone-3: rgba(236, 229, 214, .52);
  --bone-4: rgba(236, 229, 214, .14);
  --signal: #FF5A1F;
  --gold: #F2C46D;
  --ice: #9CC9E8;
  --danger: #FF3B30;
  --void: #05060A;
  --paper: #E8E1D1;
  --paper-ink: #17150F;
  --display: "Sora", system-ui, -apple-system, sans-serif;
  --serif: var(--display);
  --sans: "Sora", system-ui, -apple-system, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--void); color: var(--bone); font-family: var(--sans); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ink { pointer-events: none; }
body.flying { cursor: none; }
body.flying #ui { cursor: auto; }
#nogl { display: none; position: fixed; inset: 0; place-items: center; font: 500 18px var(--display); text-align: center; padding: 40px; }
#nogl.on { display: grid; }

/* ------------------------------------------------------------------ HUD */
#hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s var(--ease); font-variant-numeric: tabular-nums; }
#hud.on { opacity: 1; }
.hud-tl { position: absolute; left: 34px; top: 28px; }
.hud-plate { font: 500 10.5px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-2); }
.hud-name { font: 600 32px/1.05 var(--display); color: var(--bone); margin-top: 4px; letter-spacing: .005em; }
.hud-charts { display: flex; gap: 9px; margin-top: 12px; }
.hud-charts i { width: 7px; height: 7px; border: 1px solid var(--bone-3); transform: rotate(45deg); transition: all .35s var(--ease); }
.hud-charts i.done { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 10px rgba(242, 196, 109, .7); }
.hud-tr { position: absolute; right: 34px; top: 22px; text-align: right; }
.hud-clock { font: 300 44px/1 var(--sans); letter-spacing: -.01em; color: var(--bone); font-feature-settings: "tnum" 1; }
.hud-clock.pulse { animation: pulseGold .5s var(--ease); }
.hud-score { font: 500 10px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-3); margin-bottom: 4px; }
.hud-pen { position: absolute; right: calc(100% + 12px); top: 10px; white-space: nowrap; font: 500 15px var(--mono); color: var(--danger); opacity: 0; }
.hud-pen.show { animation: penFlash 1.2s var(--ease) forwards; }
@keyframes penFlash { 0% { opacity: 0; transform: translateY(-6px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
.hud-clock { position: relative; }
.hud-target { margin-top: 10px; font: 500 13px var(--sans); letter-spacing: .02em; color: var(--bone-2); font-feature-settings: "tnum" 1; }
.hud-target b { font: 600 15px var(--sans); color: var(--bone); font-feature-settings: "tnum" 1; }
.hud-ladder { position: relative; width: 250px; height: 22px; margin: 10px 0 0 auto; }
.hud-ladder::after { content: ""; position: absolute; inset: -6px -10px -6px -10px; background: rgba(5,6,10,.72); border-radius: 4px; z-index: -1; }
.hud-ladder::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 3px; background: var(--bone-4); border-radius: 2px; }
.hl-fill { position: absolute; left: 0; right: 0; top: 4px; height: 3px; transform-origin: left; transform: scaleX(0); border-radius: 2px; background: var(--signal); box-shadow: 0 0 10px rgba(255,90,31,.5); }
.hud-ladder.gold .hl-fill { background: var(--gold); box-shadow: 0 0 10px rgba(242,196,109,.6); }
.hud-ladder.silver .hl-fill { background: #C9CED6; box-shadow: 0 0 8px rgba(201,206,214,.5); }
.hud-ladder.bronze .hl-fill { background: #C98E62; box-shadow: none; }
.hl-ticks i { position: absolute; top: 0; width: 2px; height: 11px; margin-left: -1px; background: var(--bone-2); }
.hl-ticks i.ace { background: var(--signal); } .hl-ticks i.gold { background: var(--gold); } .hl-ticks i.silver { background: #C9CED6; }
.hl-ticks i em { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font: 500 9px var(--sans); font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--bone-3); white-space: nowrap; }
.hud-best { margin-top: 5px; font: 400 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--bone-3); }
.tier { display: inline-block; font: 600 15px var(--display); letter-spacing: .02em; text-transform: none; margin-right: 4px; }
.tier.silver { color: #C9CED6; } .tier.gold { color: var(--gold); } .tier.ace { color: var(--signal); } .tier.bronze { color: #C98E62; }
@keyframes pulseGold { 0% { color: var(--gold); text-shadow: 0 0 18px rgba(242, 196, 109, .8); } 100% { color: var(--bone); text-shadow: none; } }

.hud-b { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.gauge { display: grid; grid-template-columns: 66px 300px 40px; align-items: center; gap: 12px; }
.g-label { font: 500 10px var(--sans); letter-spacing: .16em; white-space: nowrap; text-transform: uppercase; color: var(--bone-3); text-align: right; }
.g-track { position: relative; height: 13px; }
.g-track::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 1px; background: var(--bone-4); }
.g-fill { position: absolute; left: 0; right: 0; top: 4px; height: 5px; background: linear-gradient(90deg, #E64A12, var(--signal) 60%, #FF8B52); transform-origin: left; box-shadow: 0 0 14px rgba(255, 90, 31, .45); transition: transform .12s linear; }
.g-kick { position: absolute; top: 4px; height: 5px; background: rgba(255, 238, 220, .55); mix-blend-mode: screen; transition: left .12s linear, width .12s linear; }
.g-ticks i { position: absolute; top: 1px; width: 1px; height: 11px; background: rgba(5, 6, 10, .65); }
.g-ticks i:nth-child(5) { background: rgba(5, 6, 10, .9); }
.g-val { font: 400 13px var(--sans); color: var(--bone-2); letter-spacing: .06em; font-feature-settings: "tnum" 1; }
.gauge.focus { grid-template-columns: 66px 300px 40px; opacity: .6; transition: opacity .3s; }
.gauge.focus .g-track { width: 120px; }
.gauge.focus .g-fill { background: var(--ice); box-shadow: 0 0 10px rgba(156, 201, 232, .5); height: 2px; top: 5.5px; }
.gauge.focus.active { opacity: 1; }
.gauge.fuel.pulse .g-fill { animation: fuelPulse .5s var(--ease); }
@keyframes fuelPulse { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }
#hud.low .fuel .g-val { color: var(--signal); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }

.hud-hint { position: absolute; left: 50%; bottom: 112px; transform: translate(-50%, 8px); font: 400 13px var(--sans); letter-spacing: .08em; color: var(--bone-2); opacity: 0; transition: all .5s var(--ease); white-space: nowrap; }
.hud-hint.on { opacity: 1; transform: translate(-50%, 0); }
.hud-hint b { font-weight: 600; color: var(--bone); letter-spacing: .12em; }

/* ------------------------------------------------------------------ UI screens */
#ui { position: fixed; inset: 0; pointer-events: none; }
.scr { position: absolute; inset: 0; pointer-events: auto; opacity: 0; transform: translateY(10px); transition: opacity .32s var(--ease), transform .45s var(--ease); }
.scr.in { opacity: 1; transform: none; }
.scr.out { opacity: 0; transform: translateY(-6px); pointer-events: none; transition-duration: .22s; }
.kicker { font: 500 10.5px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--bone-2); }
button { all: unset; cursor: pointer; }
kbd { display: inline-block; font: 600 9.5px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--bone-2); border: 1px solid var(--bone-4); border-bottom-color: var(--bone-3); padding: 3px 6px 2px; border-radius: 3px; margin-left: 10px; vertical-align: 2px; }
.locked { opacity: .5; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }

/* title */
.scr-title { display: grid; grid-template-rows: 1fr auto auto; padding: 0 8vw 5vh; background: linear-gradient(90deg, rgba(5,6,10,.82) 0%, rgba(5,6,10,.35) 46%, rgba(5,6,10,0) 70%); }
.t-mark { align-self: end; margin-bottom: 5vh; }
.t-mark h1 { font: 600 clamp(84px, 11.5vw, 178px)/.86 var(--display); letter-spacing: -.025em; color: var(--bone); margin: 16px 0 14px -6px; text-shadow: 0 0 60px rgba(242,196,109,.12); }
.t-sub { font: 600 24px var(--display); color: var(--bone-2); letter-spacing: .01em; }
.t-menu { display: flex; flex-direction: column; gap: 2px; margin-bottom: 7vh; width: max-content; }
.t-menu button, .r-nav button, .pz-box nav button, .cr-go, .tx-go, .st-back { position: relative; font: 500 24px/1.3 var(--display); color: var(--bone-2); padding: 6px 0 6px 30px; transition: color .25s var(--ease), padding .3s var(--ease); }
.t-menu button em { display: block; font: 500 10px var(--sans); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--bone-3); margin-top: 2px; }
.t-menu button::before, .r-nav button::before, .pz-box nav button::before, .cr-go::before, .tx-go::before, .st-back::before { content: ""; position: absolute; left: 0; top: 50%; width: 0; height: 1px; background: var(--signal); transition: width .3s var(--ease); }
.t-menu button.foc, .r-nav button.foc, .pz-box nav button.foc, .cr-go.foc, .tx-go.foc, .st-back.foc { color: var(--bone); padding-left: 40px; }
.t-menu button.foc::before, .r-nav button.foc::before, .pz-box nav button.foc::before, .cr-go.foc::before, .tx-go.foc::before, .st-back.foc::before { width: 26px; }
.t-menu button.foc em { color: var(--signal); }
.t-menu button.t-continue { font-size: 34px; }
.t-foot { display: flex; align-items: center; gap: 16px; font: 500 10px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-3); }
.t-foot .sep { width: 28px; height: 1px; background: var(--bone-4); }

/* plates */
.scr-plates { display: grid; grid-template-rows: auto 1fr; padding: 34px 5vw 4vh; background: rgba(5,6,10,.86); }
.p-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bone-4); padding-bottom: 14px; }
.p-back { font: 500 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--bone-2); }
.p-back.foc { color: var(--bone); }
.p-body { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.15fr); gap: 3vw; padding-top: 18px; min-height: 0; }
.p-fields { display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.fld { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; padding: 10px 12px 10px 14px; border-left: 1px solid var(--bone-4); transition: all .25s var(--ease); }
.fld .fn { font: 600 24px var(--display); color: var(--bone-3); }
.fld .fname { font: 400 15px var(--sans); color: var(--bone-2); letter-spacing: .02em; }
.fld .fname em { display: block; font: 500 9.5px var(--sans); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--bone-3); margin-top: 3px; }
.fld .fmed i { display: inline-block; font: 600 10px var(--sans); font-style: normal; padding: 2px 5px; margin-left: 4px; border: 1px solid; border-radius: 2px; }
.fld .fmed .m4 { color: var(--signal); } .fld .fmed .m3 { color: var(--gold); }
.fld.sel { border-left-color: var(--signal); background: linear-gradient(90deg, rgba(255,90,31,.07), transparent 70%); }
.fld.sel .fn, .fld.sel .fname { color: var(--bone); }
.fld.foc { background: linear-gradient(90deg, rgba(236,229,214,.07), transparent 80%); }
.p-grid { min-width: 0; overflow: auto; padding-right: 8px; }
.p-fhead { display: flex; align-items: baseline; gap: 18px; margin-bottom: 22px; }
.p-fhead .fn { font: 600 64px/1 var(--display); color: var(--signal); }
.p-fhead h2 { font: 600 44px/1 var(--display); font-weight: 400; color: var(--bone); }
.p-fhead .fsub { font: 500 10.5px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-3); margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 14px; }
.card .pn { font-size: 15px !important; }
.card { position: relative; display: block; transition: transform .3s var(--ease); }
.card .thumb { aspect-ratio: 16 / 10.5; background: radial-gradient(120% 100% at 50% 40%, #0b0d14, #040509); border: 1px solid var(--bone-4); overflow: hidden; transition: border-color .25s; }
.card .thumb svg { width: 100%; height: 100%; display: block; }
.card .sealed { height: 100%; display: grid; place-items: center; color: var(--bone-3); }
.card .label { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; background: var(--paper); color: var(--paper-ink); padding: 7px 10px 6px; }
.card .pl { font: 600 10px var(--sans); letter-spacing: .14em; }
.card .pn { font: 600 17px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .pt { font: 500 11px var(--sans); font-feature-settings: "tnum" 1; color: #5b5545; }
.card.foc { transform: translateY(-4px); }
.card.foc .thumb { border-color: var(--bone-2); }
.card.foc .label { box-shadow: inset 4px 0 0 var(--signal); }
.card.locked .label { background: #3a3730; color: #8f897b; }
.mini-stamp { position: absolute; right: -10px; top: -12px; width: 74px; transform: rotate(-9deg); pointer-events: none; }
.stamp { width: 100%; height: auto; display: block; }

/* transmission */
.scr-tx { display: grid; place-content: center; padding: 8vh 10vw; background: rgba(4,5,8,.9); }
.tx-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--bone-4); padding-bottom: 12px; margin-bottom: 30px; width: min(760px, 80vw); }
.tx-route { font: 500 10.5px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-3); }
.tx-route i { color: var(--signal); font-style: normal; margin: 0 6px; }
.tx-body { width: min(760px, 80vw); }
.tx-body p { font: 600 27px/1.42 var(--display); color: var(--bone); margin-bottom: 18px; }
.tx-body p span { opacity: 0; display: inline-block; transform: translateY(4px); filter: blur(3px); animation: word .5s var(--d) var(--ease) forwards; }
.scr-tx.shown .tx-body p span, .scr-tx.shown .tx-go { animation-delay: 0s !important; animation-duration: .2s; }
@keyframes word { to { opacity: 1; transform: none; filter: none; } }
.tx-go { margin-top: 18px; font-size: 22px; opacity: 0; animation: fadeIn .6s var(--d) forwards; }
@keyframes fadeIn { to { opacity: 1; } }

/* results */
.scr-results { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 4vw; align-items: center; padding: 6vh 6vw; background: radial-gradient(80% 90% at 40% 50%, rgba(5,6,10,.72), rgba(5,6,10,.9)); }
.r-plate { position: relative; justify-self: end; width: min(100%, 880px); }
.r-img { aspect-ratio: 16 / 10; background: radial-gradient(120% 100% at 50% 40%, #0b0d14, #030407); border: 1px solid var(--bone-4); }
.r-img svg { width: 100%; height: 100%; display: block; }
.r-img .route { stroke-dasharray: 9000; stroke-dashoffset: 9000; animation: draw 1.4s .15s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.r-label { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 18px; align-items: baseline; background: var(--paper); color: var(--paper-ink); padding: 12px 18px 12px; }
.r-id { font: 600 10.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.r-name { font: 600 30px/1 var(--display); }
.r-exp { grid-row: span 2; text-align: right; }
.r-exp span { display: block; font: 600 9.5px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: #6c6555; }
.r-exp b { font: 300 40px/1 var(--sans); font-feature-settings: "tnum" 1; letter-spacing: -.01em; }
.r-delta { grid-column: 1 / 3; font: 500 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: #6c6555; margin-top: 4px; }
.r-delta b { color: #B43A0A; }
.r-stamp { position: absolute; right: 26px; top: 22px; width: 190px; transform: rotate(-8deg); opacity: 0; animation: stampIn .38s .4s cubic-bezier(.3, 1.6, .5, 1) forwards; }
@keyframes stampIn { 0% { opacity: 0; transform: rotate(-14deg) scale(1.9); } 100% { opacity: .95; transform: rotate(-8deg) scale(1); } }
.r-side { display: flex; flex-direction: column; gap: 26px; }
.ladder { list-style: none; border-top: 1px solid var(--bone-4); }
.ladder li { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--bone-4); color: var(--bone-3); }
.ladder .tn { font: 600 22px var(--display); }
.ladder .tt { font: 400 14px var(--sans); font-feature-settings: "tnum" 1; letter-spacing: .04em; }
.ladder li.got { color: var(--bone); }
.ladder li.got.t1 .tn { color: #C98E62; } .ladder li.got.t2 .tn { color: #C9CED6; } .ladder li.got.t3 .tn { color: var(--gold); } .ladder li.got.t4 .tn { color: var(--signal); }
.ladder li.got .tt::after { content: " ✓"; color: var(--bone-2); }
.r-meta { font: 500 10px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--bone-3); }
.r-nav { display: flex; flex-direction: column; }
.r-nav button { font-size: 23px; }

/* pause + settings + credits */
.scr-pause, .scr-settings, .scr-credits { display: grid; place-items: center; background: rgba(4,5,8,.78); }
.pz-box, .st-box, .cr-box { width: min(560px, 86vw); }
.pz-box h2, .st-box h2 { font: 600 46px/1.1 var(--display); font-weight: 400; margin: 8px 0 22px; }
.pz-box nav { display: flex; flex-direction: column; border-top: 1px solid var(--bone-4); padding-top: 10px; }
.pz-box nav button { font-size: 24px; }
.pz-keys div { display: grid; grid-template-columns: 92px 1fr; align-items: baseline; }
.pz-keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--bone-4); font: 400 12px var(--sans); color: var(--bone-3); letter-spacing: .03em; }
.pz-keys b { font-weight: 600; color: var(--bone-2); letter-spacing: .1em; font-size: 11px; }
.st-rows { border-top: 1px solid var(--bone-4); }
.st-row { display: grid; grid-template-columns: 1fr 180px 48px; gap: 16px; align-items: center; padding: 12px 10px; border-bottom: 1px solid var(--bone-4); font: 400 14px var(--sans); color: var(--bone-2); cursor: pointer; transition: background .2s; }
.st-row.foc { color: var(--bone); background: linear-gradient(90deg, rgba(255,90,31,.08), transparent); box-shadow: inset 2px 0 0 var(--signal); }
.st-bar { position: relative; height: 14px; }
.st-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: var(--bone-4); }
.st-bar i { position: absolute; left: 0; right: 0; top: 5px; height: 4px; background: var(--bone-2); transform-origin: left; }
.st-row.foc .st-bar i { background: var(--signal); }
.st-v { font: 500 12px var(--sans); text-align: right; font-feature-settings: "tnum" 1; color: var(--bone-3); grid-column: 3; }
.st-full .st-v, .st-reset .st-v { grid-column: 2 / 4; }
.st-reset .st-l { color: #c8695a; }
.st-back { margin-top: 18px; font-size: 22px; }
.cr-box h1 { font: 600 96px/1 var(--display); font-weight: 400; margin: 14px 0; }
.cr-l { font: 500 12px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--bone-2); }
.cr-s { font: 600 20px/1.5 var(--display); color: var(--bone-3); margin: 24px 0; }

/* deep survey */
.scr-draft { display: grid; grid-template-rows: auto 1fr auto; padding: 9vh 8vw 6vh; background: rgba(4,5,8,.86); }
.dr-head h2 { font: 600 54px/1.05 var(--display); font-weight: 400; margin: 10px 0 14px; }
.dr-stats { display: flex; gap: 28px; font: 500 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--bone-3); }
.dr-stats b { color: var(--bone); font-weight: 500; font-feature-settings: "tnum" 1; }
.dr-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 300px)); gap: 28px; align-content: center; }
.dr-card { display: flex; flex-direction: column; border: 1px solid var(--bone-4); background: linear-gradient(180deg, rgba(236,229,214,.03), rgba(236,229,214,0)); transition: transform .3s var(--ease), border-color .3s; }
.dr-glyph { height: 150px; display: grid; place-items: center; color: var(--bone-2); transition: color .3s; }
.dr-glyph svg { width: 76px; height: 76px; }
.dr-label { display: flex; align-items: baseline; gap: 12px; background: var(--paper); color: var(--paper-ink); padding: 10px 14px 8px; }
.dr-n { font: 600 10px var(--sans); letter-spacing: .16em; }
.dr-name { font: 600 23px/1.1 var(--display); }
.dr-desc { padding: 14px 14px 18px; font: 400 13.5px/1.45 var(--sans); color: var(--bone-2); }
.dr-card.foc { transform: translateY(-6px); border-color: var(--bone-2); }
.dr-card.foc .dr-glyph { color: var(--signal); }
.dr-card.foc .dr-label { box-shadow: inset 4px 0 0 var(--signal); }
.dr-foot { font: 500 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--bone-3); }
.scr-deepover { display: grid; place-items: center; background: rgba(4,5,8,.82); }
.do-box { width: min(560px, 86vw); }
.do-box h2 { font: 600 40px/1.15 var(--display); font-weight: 400; margin: 10px 0 20px; }
.do-big { display: flex; align-items: baseline; gap: 16px; border-top: 1px solid var(--bone-4); border-bottom: 1px solid var(--bone-4); padding: 14px 0; margin-bottom: 8px; }
.do-big span { font: 500 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--bone-3); }
.do-big b { font: 600 72px/1 var(--display); font-weight: 400; color: var(--bone); }
.do-big em { font: 500 10px var(--sans); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--signal); margin-left: auto; }
.do-row { display: flex; justify-content: space-between; gap: 20px; padding: 9px 0; border-bottom: 1px solid var(--bone-4); font: 400 13px var(--sans); color: var(--bone-3); }
.do-row b { font-weight: 500; color: var(--bone-2); text-align: right; }
.do-box .r-nav { margin-top: 22px; }
#plotting { position: fixed; right: 34px; bottom: 30px; font: 500 10.5px var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--bone-2); opacity: 0; transition: opacity .3s; pointer-events: none; display: flex; align-items: center; gap: 12px; }
#plotting span { width: 14px; height: 14px; border: 1px solid var(--bone-3); border-top-color: var(--signal); border-radius: 50%; animation: spin .8s linear infinite; }
#plotting.on { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.hud-deep { position: absolute; left: calc(100% + 8px); white-space: nowrap; font: 500 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ice); opacity: .8; }
.gauge.fuel { position: relative; }
.hud-keys { position: absolute; left: 34px; bottom: 30px; display: flex; gap: 18px; font: 500 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--bone-3); opacity: .7; }
.hud-keys b { color: var(--bone-2); font-weight: 600; margin-right: 4px; }
.hud-title { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; opacity: 0; pointer-events: none; }
.hud-title.show { animation: plateTitle 2.2s var(--ease) forwards; }
.hud-title.show.gone { animation: none; opacity: 0; transition: opacity .18s; }
.ht-id { font: 500 11px var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--bone-2); }
.ht-name { font: 600 64px/1.1 var(--display); color: var(--bone); margin-top: 6px; text-shadow: 0 0 40px rgba(5,6,10,.9); }
.ht-obj { font: 400 13px var(--sans); letter-spacing: .06em; color: var(--bone-2); margin-top: 10px; }
.ht-obj { font-size: 16px; letter-spacing: .01em; color: var(--bone); }
.ht-obj b { font-weight: 600; color: var(--gold); }
.ht-med { margin-top: 8px; font: 400 13px var(--sans); color: var(--bone-2); }
.ht-med .tier { font-size: 13px; }
@keyframes plateTitle { 0% { opacity: 0; transform: translate(-50%, -46%); letter-spacing: .02em; } 18% { opacity: 1; transform: translate(-50%, -50%); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -53%); } }
#shutter { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#shutter i { position: absolute; left: 0; right: 0; height: 50.5%; background: #05060a; transform: scaleY(0); }
#shutter i:first-child { top: 0; transform-origin: top; border-bottom: 1px solid rgba(236,229,214,.25); }
#shutter i:last-child { bottom: 0; transform-origin: bottom; border-top: 1px solid rgba(236,229,214,.25); }
#shutter.close i { animation: shutClose .19s cubic-bezier(.6,0,.9,.4) forwards; }
#shutter.open i { animation: shutOpen .34s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes shutClose { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes shutOpen { from { transform: scaleY(1); } to { transform: scaleY(0); } }
.ladder li { opacity: 0; animation: fadeIn .35s forwards; }
.ladder li:nth-child(1) { animation-delay: .25s; } .ladder li:nth-child(2) { animation-delay: .32s; }
.ladder li:nth-child(3) { animation-delay: .39s; } .ladder li:nth-child(4) { animation-delay: .46s; }

.p-tally { display: flex; gap: 22px; font: 500 10.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--bone-3); margin-left: auto; margin-right: 36px; }
.p-tally b { color: var(--bone); font-weight: 500; font-feature-settings: "tnum" 1; }
.p-tally .tg b { color: var(--gold); } .p-tally .ta b { color: var(--signal); }
.p-chart { min-height: 0; display: grid; place-items: center; }
.lacuna { width: 100%; max-height: 78vh; overflow: visible; }
.lacuna .fld { cursor: pointer; transition: opacity .3s; }
.lacuna .fld.locked { opacity: .28; }
.lacuna .lc-hit { fill: transparent; }
.lacuna .lc-sel { fill: none; stroke: var(--signal); stroke-opacity: 0; stroke-dasharray: 2 5; transition: stroke-opacity .3s; }
.lacuna .fld.sel .lc-sel { stroke-opacity: .8; }
.lacuna .fld.foc .lc-sel { stroke-opacity: .45; }
.lacuna .lc-con { fill: none; stroke: #ECE5D6; stroke-opacity: .22; stroke-width: 1; }
.lacuna .fld.sel .lc-con { stroke-opacity: .5; }
.lacuna .lc-star { fill: #ECE5D6; transition: r .2s; }
.lacuna .lc-star.shut { fill: #ECE5D6; fill-opacity: .25; }
.lacuna .lc-star.open { fill: #05060a; stroke: #ECE5D6; stroke-width: 1.2; }
.lacuna .lc-star.done { fill: #ECE5D6; }
.lacuna .lc-star.gold { fill: #F2C46D; } .lacuna .lc-star.ace { fill: #FF5A1F; }
.lacuna .lc-star.hl { r: 7px; }
.lacuna .lc-halo { fill: none; stroke-width: 1; stroke-opacity: .45; } .lacuna .lc-halo.gold { stroke: #F2C46D; } .lacuna .lc-halo.ace { stroke: #FF5A1F; }
.lacuna .lc-num { font: 600 34px var(--display); fill: rgba(236,229,214,.55); }
.lacuna .lc-name { font: 500 13px var(--sans); letter-spacing: .2em; text-transform: uppercase; fill: rgba(236,229,214,.4); }
.lacuna .fld.sel .lc-num { fill: var(--signal); } .lacuna .fld.sel .lc-name { fill: var(--bone); }
.lacuna .lc-core { font: 600 20px var(--display); fill: rgba(242,196,109,.0); }
.lacuna .lc-probe { fill: var(--signal); animation: blink 1.4s ease-in-out infinite; }
.scr-credits { display: block; background: #05060a; }
.cr-chart { position: absolute; inset: 0; display: grid; place-items: center; padding: 5vh 0 2vh 18vw; }
.cr-chart .lacuna { height: 90vh !important; }
.cr-chart .lacuna { width: auto; height: 94vh; max-height: none; }
.cr-chart .fr { stroke-dasharray: 1; stroke-dashoffset: 1; animation: frDraw 1.6s var(--o) var(--ease) forwards; }
@keyframes frDraw { to { stroke-dashoffset: 0; } }
.cr-scrim { position: absolute; left: 0; bottom: 0; width: 50vw; height: 56vh; background: radial-gradient(100% 100% at 0% 100%, rgba(5,6,10,.95) 45%, rgba(5,6,10,0)); }
.scr-credits .cr-box { position: absolute; left: 6vw; bottom: 6vh; width: min(500px, 36vw); }
.scr-credits .cr-box h1 { font-size: 54px; }
.cr-box h1 { font-size: 64px; line-height: 1.05; }
.cr-box h1 i { color: var(--gold); }
.r-nav .r-save { font-size: 17px; color: var(--bone-3); }
/* the final transmission: ink on a developed plate */
.scr-tx.paper { background: #EDE6D6; animation: paperIn 1.6s ease forwards; }
@keyframes paperIn { from { background: #FFFDF6; } to { background: #E8E1D1; } }
.scr-tx.paper .tx-head { border-bottom-color: rgba(23,21,15,.18); }
.scr-tx.paper .kicker, .scr-tx.paper .tx-route { color: rgba(23,21,15,.55); }
.scr-tx.paper .tx-body p { color: #17150F; font-size: 34px; }
.scr-tx.paper .tx-go { color: rgba(23,21,15,.6); }
.scr-tx.paper .tx-go.foc { color: #17150F; }
.scr-tx.paper kbd { color: rgba(23,21,15,.6); border-color: rgba(23,21,15,.25); }
.pz-box nav button em { display: block; font: 500 9.5px var(--sans); font-style: normal; letter-spacing: .18em; text-transform: uppercase; color: var(--bone-3); }
.r-plate { position: relative; }
.r-legend { position: absolute; left: 16px; top: 12px; display: flex; align-items: center; gap: 8px; font: 500 9.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--bone-3); }
.r-legend i { display: inline-block; width: 22px; height: 0; border-top: 1.5px solid var(--bone); margin-left: 10px; }
.r-legend i.lg-old { border-top: 1.5px dashed var(--ice); }
.hud-target.drop { animation: paceDrop .6s var(--ease); }
@keyframes paceDrop { 0% { opacity: 0; transform: translateY(-6px); } 30% { opacity: 1; color: var(--danger); } 100% { transform: none; } }
/* HUD safe-area scrims */
#hud::before, #hud::after { content: ""; position: absolute; top: 0; width: 520px; height: 190px; pointer-events: none; }
#hud::before { left: 0; background: radial-gradient(90% 100% at 0% 0%, rgba(5,6,10,.62), rgba(5,6,10,0) 70%); }
#hud::after { right: 0; background: radial-gradient(90% 100% at 100% 0%, rgba(5,6,10,.62), rgba(5,6,10,0) 70%); }
.hud-b::before { content: ""; position: absolute; left: -200px; right: -200px; top: -30px; bottom: -40px; background: radial-gradient(50% 100% at 50% 100%, rgba(5,6,10,.55), rgba(5,6,10,0) 75%); z-index: -1; pointer-events: none; }
.hud-tl, .hud-tr, .hud-b { z-index: 1; }
#hud.low .fuel .g-val { color: var(--signal); animation: none; font-weight: 600; }
#hud.low .fuel .g-track::after { content: "low"; position: absolute; right: 0; top: -14px; font: 600 9px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--signal); }
#hud.low .fuel .g-fill { animation: lowPulse 0.9s ease-in-out infinite; }
@keyframes lowPulse { 50% { filter: brightness(1.8); } }
.hud-title { top: 26%; }
body.menu .hud-title { display: none; }
.r-gap { font: 400 15px var(--sans); color: var(--bone-2); letter-spacing: .02em; margin-top: -8px; }
.r-gap b { font: 400 30px var(--sans); color: var(--bone); font-feature-settings: "tnum" 1; margin-right: 6px; }
.r-gap .tier { font-size: 22px; }
.r-gap.ace { font: 600 22px var(--display); color: var(--signal); }
.r-note, .pz-note { font: 600 17px/1.35 var(--display); color: var(--bone); max-width: 330px; margin: 2px 0 0; padding-left: 12px; border-left: 1px solid var(--gold); }
.r-note span, .pz-note span { display: block; font: 500 9.5px var(--sans); font-style: normal; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.r-note.locked { color: var(--bone-3); border-left-color: var(--bone-3); }
.r-note.locked span { color: var(--bone-3); }
.pz-note { margin: -10px 0 22px; max-width: 420px; }
.r-img .route-hot { stroke-dasharray: 9000; stroke-dashoffset: 9000; animation: draw 1.4s .25s var(--ease) forwards; }

/* scale the HUD and menus with the viewport (designed at 1440×900) */
html { font-size: clamp(13px, 0.62vw + 6px, 20px); }
#hud { zoom: clamp(0.85, calc(100vh / 900px), 1.5); }
@supports not (zoom: 1) { #hud { transform: scale(clamp(0.85, calc(100vh / 900px), 1.5)); transform-origin: top left; } }
.cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.p-grid { display: flex; flex-direction: column; }
.card .thumb { aspect-ratio: auto; height: clamp(110px, 22vh, 260px); }
.hud-relic { display: inline-block; width: 8px; height: 8px; margin: 12px 0 0 14px; border: 1px solid var(--gold); transform: rotate(45deg); opacity: .55; vertical-align: top; }
.hud-tl { display: block; }
.hud-charts { display: inline-flex; }
.hud-relic.kept { border-color: var(--ice); }
.hud-relic.got { background: var(--gold); opacity: 1; box-shadow: 0 0 12px rgba(242,196,109,.8); }
.relic-g { display: inline-block; width: 6px; height: 6px; border: 1px solid #8a7a50; transform: rotate(45deg); margin-right: 8px; vertical-align: 1px; }
.relic-g.got { background: #B8860B; border-color: #B8860B; }
.r-relic { color: var(--gold); margin-left: 14px; }
.p-tally .tr b { color: var(--gold); }
.pig { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.st-pig .st-v { grid-column: 2 / 4; } .st-pig .st-v em { font-style: normal; color: var(--bone-3); margin-left: 8px; }
.p-expo { position: relative; display: flex; align-items: baseline; gap: 14px; margin: -8px 0 16px; padding: 8px 0 8px 14px; border-left: 1px solid var(--bone-4); transition: all .25s var(--ease); }
.p-expo .xn { font: 600 22px var(--display); color: var(--bone-2); }
.p-expo em { font: 500 9.5px var(--sans); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--bone-3); }
.p-expo .xm { width: 64px; margin-left: auto; transform: rotate(-6deg); }
.p-expo.foc { border-left-color: var(--signal); background: linear-gradient(90deg, rgba(255,90,31,.07), transparent 60%); }
.p-expo.foc .xn { color: var(--bone); }
.scr-expres { display: grid; place-items: center; background: rgba(4,5,8,.84); }
.ex-stamp { width: 170px; margin: 18px 0 0 auto; transform: rotate(-7deg); animation: stampIn .38s .3s cubic-bezier(.3,1.6,.5,1) both; }
.hud-split { margin-top: 4px; font: 500 15px var(--sans); font-feature-settings: "tnum" 1; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s; }
.hud-split.show { opacity: 1; transform: none; }
.hud-split.ahead { color: var(--gold); } .hud-split.behind { color: var(--danger); }
.dr-cards { grid-template-columns: repeat(auto-fit, minmax(0, 280px)); }
.dr-par { color: var(--gold) !important; }
.hud-need { font: 500 9.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-left: 6px; align-self: center; }
.scr-guide { display: grid; place-items: center; background: rgba(4,5,8,.9); overflow: auto; }
.gd-box { width: min(1100px, 90vw); padding: 5vh 0; }
.gd-box h2 { font: 600 46px/1.1 var(--display); font-weight: 400; margin: 8px 0 22px; }
.gd-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 34px; border-top: 1px solid var(--bone-4); padding-top: 18px; }
.gd-item { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: start; }
.gd-item svg { width: 120px; height: 80px; background: #05060a; border: 1px solid var(--bone-4); }
.gd-item h3 { font: 600 22px var(--display); font-weight: 400; color: var(--bone); margin-bottom: 4px; }
.gd-item p { font: 400 13px/1.5 var(--sans); color: var(--bone-2); }
.gd-item.locked h3 { color: var(--bone-3); }
.hud-toast { position: absolute; left: 50%; top: 116px; transform: translateX(-50%); font: 600 20px var(--display); color: var(--gold); opacity: 0; pointer-events: none; text-shadow: 0 0 20px rgba(5,6,10,.9); white-space: nowrap; }
.hud-toast.show { animation: toast 2.4s var(--ease) forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 6px); } 12% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; } 100% { opacity: 0; } }
.hud-relic { border-radius: 50%; transform: none; width: 9px; height: 9px; box-shadow: inset 0 0 0 2px #05060a; }
.hud-charts i.need { margin-right: 10px; position: relative; }
.hud-charts i.need::after { content: ""; position: absolute; right: -9px; top: -4px; width: 1px; height: 12px; background: var(--gold); transform: rotate(-45deg); }
.hud-split.behind { color: var(--bone-2) !important; }
.hud-split span { font: 500 9.5px var(--sans); letter-spacing: .16em; color: var(--bone-3); margin-right: 8px; text-transform: uppercase; }
.hud-title::before { content: ""; position: absolute; inset: -30px -80px; background: radial-gradient(closest-side, rgba(5,6,10,.7), rgba(5,6,10,0)); z-index: -1; }
.relic-g { border-radius: 50%; transform: none; }
.hud-b::before { bottom: -60px; }
.ex-table { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 26px; margin: 6px 0 12px; }
.ex-table div { display: flex; gap: 10px; align-items: baseline; font: 400 12px var(--sans); color: var(--bone-3); padding: 4px 0; border-bottom: 1px solid var(--bone-4); }
.ex-table span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-table b { font-weight: 500; color: var(--bone-2); font-feature-settings: "tnum" 1; }
.ex-table em { font-style: normal; font-size: 10.5px; color: var(--gold); width: 42px; text-align: right; }
.i.u, i.u { font-style: normal; text-transform: none; }
.p-tally .z b { color: var(--bone-3) !important; }
.p-expo { border: 1px solid var(--bone-4); border-left-width: 2px; padding: 9px 16px; width: max-content; min-width: 340px; }
.card .label { background: #cfc8b8; }
.card.m3 .label, .card.m4 .label { background: var(--paper); }
.gd-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.r-splits { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 12px var(--sans); font-feature-settings: "tnum" 1; margin-top: -10px; }
.r-splits span { color: var(--bone-2); } .r-splits span.a { color: var(--gold); }
.r-splits i { font-style: normal; font-size: 9.5px; letter-spacing: .14em; color: var(--bone-3); margin-right: 5px; }
/* soft backing behind the HUD corners so the world never fights the clock or the medal bar */
.hud-tr::before, .hud-tl::before { content: ""; position: absolute; z-index: -1; pointer-events: none; }
.hud-tr::before { inset: -40px -50px -40px -110px; background: radial-gradient(closest-side at 70% 45%, rgba(5,6,10,.78), rgba(5,6,10,.45) 60%, rgba(5,6,10,0)); }
.hud-tl::before { inset: -40px -110px -40px -50px; background: radial-gradient(closest-side at 30% 45%, rgba(5,6,10,.7), rgba(5,6,10,.35) 60%, rgba(5,6,10,0)); }

/* ================================================================ v2: the run */
.cr { display: inline-flex; align-items: center; gap: 6px; font-feature-settings: "tnum" 1; }
.cr i { width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 8px rgba(242,196,109,.6); flex: none; }
.hull { display: inline-flex; gap: 5px; vertical-align: middle; }
.hull i { width: 14px; height: 9px; border: 1px solid var(--bone-3); clip-path: polygon(0 100%, 50% 0, 100% 100%); background: transparent; }
.hull i.on { background: var(--bone); border-color: var(--bone); }
.hull i { clip-path: none; border-radius: 2px; }

.hud-run { display: none; margin-top: 12px; align-items: center; gap: 18px; font: 500 13px var(--sans); color: var(--bone); }
#hud.in-run .hud-run { display: flex; }
.hud-run .hull i { width: 12px; height: 6px; }
.hr-cr.pulse b { animation: pulseGold .6s var(--ease); }
.hr-probes { display: inline-flex; align-items: center; gap: 4px; }
.hr-probes em { width: 7px; height: 7px; border-radius: 50%; border: 1px solid #7FE0FF; opacity: .5; }
.hr-probes em.on { background: #7FE0FF; opacity: 1; box-shadow: 0 0 8px rgba(127,224,255,.7); }
.hr-probes kbd { margin-left: 6px; }
.hud-need { font: 500 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--bone-2); margin-left: 8px; }
.hud-need b { color: var(--gold); font-weight: 600; }
.ht-new { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; font: 400 14px var(--sans); color: var(--bone); }
.ht-new b:first-child, .ri-new b:first-child { display: inline-block; font: 600 9px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: #05060a; background: #7FE0FF; padding: 2px 6px 1px; border-radius: 2px; margin-right: 8px; vertical-align: 2px; }

/* start of a run */
.scr-runstart { display: grid; place-items: center; background: rgba(4,5,8,.86); }
.rn-box { width: min(1000px, 88vw); }
.rn-box h2 { font: 600 52px/1.05 var(--display); margin: 10px 0 22px; }
.rn-rules { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40px; padding: 18px 0; border-top: 1px solid var(--bone-4); border-bottom: 1px solid var(--bone-4); counter-reset: r; }
.rn-rules li { font: 400 15px/1.45 var(--sans); color: var(--bone-2); padding-left: 34px; position: relative; counter-increment: r; }
.rn-rules li::before { content: counter(r); position: absolute; left: 0; top: 0; font: 600 15px var(--display); color: var(--signal); }
.rn-rules b { color: var(--bone); font-weight: 600; }
.rn-pick { margin: 26px 0 14px; font: 500 10.5px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-2); }
.rn-box .dr-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.dr-glyph { height: 110px; }
.dr-glyph svg { width: 60px; height: 60px; }
.dr-label { justify-content: space-between; }
.dr-price { font: 600 15px var(--sans); }
.dr-price .cr i { background: #9a6f14; box-shadow: none; }
.dr-desc b { color: var(--bone); font-weight: 600; }
.dr-card.poor { opacity: .42; }
.dr-card.sold { opacity: .3; }
.dr-card.sold .dr-label::after { content: "bought"; font: 600 10px var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.dr-card.sold .dr-price { display: none; }

/* the zone map */
.scr-runmap, .scr-shop { display: grid; grid-template-rows: auto 1fr auto; padding: 4vh 5vw 3vh; background: radial-gradient(120% 120% at 30% 50%, rgba(5,6,10,.78), rgba(5,6,10,.94)); gap: 2vh; }
.rm-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--bone-4); padding-bottom: 16px; }
.rm-head h2 { font: 600 44px/1.05 var(--display); margin-top: 8px; }
.rs-status { display: flex; gap: 34px; align-items: flex-end; }
.rs-status > div { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.rs-k { font: 500 9.5px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-3); }
.rs-status b { font: 500 18px var(--sans); color: var(--bone); }
.rs-cr { font-size: 26px !important; color: var(--gold) !important; }
.rs-cr .cr i { width: 11px; height: 11px; }
.rm-body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 3vw; min-height: 0; }
.rm-map { position: relative; min-height: 300px; }
.rm-edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.rm-edges line { stroke: rgba(236,229,214,.16); stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-dasharray: 3 5; }
.rm-edges line.on { stroke: rgba(236,229,214,.7); stroke-dasharray: none; stroke-width: 2; }
.rm-edges line.next { stroke: rgba(255,90,31,.7); stroke-dasharray: none; stroke-width: 1.6; }
.mn { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .25s var(--ease), opacity .25s; }
.mn svg { width: 68px; height: 68px; overflow: visible; }
.mn span { font: 500 9.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--bone-3); white-space: nowrap; }
.mn .ni-disk { fill: #0a0c12; stroke: rgba(236,229,214,.55); stroke-width: 1.5; }
.mn .ni-disk.gold, .mn .ni-ring.gold { stroke: var(--gold); }
.mn .ni-disk.boss { stroke: var(--signal); stroke-width: 2; }
.mn .ni-ring { fill: none; stroke-width: 1; stroke-dasharray: 3 3; }
.mn .ni-ring.boss { stroke: var(--signal); }
.mn .ni-core { fill: #000; stroke: rgba(236,229,214,.9); stroke-width: 1.2; }
.mn .ni-chip { fill: var(--gold); }
.mn .ni-dock { fill: #0a0c12; stroke: #7FE0FF; stroke-width: 1.5; }
.mn .ni-glyph { fill: none; stroke: #7FE0FF; stroke-width: 1.8; stroke-linecap: round; }
.mn.far { opacity: .38; }
.mn.past { opacity: .55; }
.mn.past .ni-disk, .mn.cur .ni-disk { fill: rgba(236,229,214,.18); }
.mn.cur svg { filter: drop-shadow(0 0 10px rgba(255,90,31,.6)); }
.mn.cur span { color: var(--signal); }
.mn.reach span { color: var(--bone-2); }
.mn.reach svg { animation: nodePulse 1.6s ease-in-out infinite; }
.mn.reach.foc { transform: translate(-50%, -50%) scale(1.18); }
.mn.reach.foc span { color: var(--bone); }
.mn.reach.foc svg { animation: none; filter: drop-shadow(0 0 12px rgba(242,196,109,.55)); }
@keyframes nodePulse { 50% { filter: drop-shadow(0 0 8px rgba(242,196,109,.5)); } }
.rm-info { border-left: 1px solid var(--bone-4); padding-left: 26px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.rm-info h3 { font: 600 30px/1.1 var(--display); }
.rm-info p { font: 400 14px/1.5 var(--sans); color: var(--bone-2); }
.ri-pay { display: flex; gap: 14px; align-items: baseline; font: 500 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--bone-3); }
.ri-pay .tier { font-size: 14px; letter-spacing: 0; text-transform: none; }
.ri-thumb { aspect-ratio: 16 / 10; border: 1px solid var(--bone-4); background: radial-gradient(120% 100% at 50% 40%, #0b0d14, #040509); display: grid; place-items: center; }
.ri-thumb svg { width: 100%; height: 100%; display: block; }
.ri-wait { font: 500 10px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-3); }
.ri-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.ri-tags span { font: 500 11px var(--sans); color: var(--bone-2); border: 1px solid var(--bone-4); padding: 4px 8px; border-radius: 2px; }
.ri-new { width: 100%; font-size: 13px !important; color: var(--bone) !important; margin-top: 4px; }
.rm-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--bone-4); padding-top: 12px; }
.rs-kit { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 500 11px var(--sans); color: var(--bone-2); }
.rs-kit span { display: inline-flex; align-items: center; gap: 6px; }
.rs-kit svg { width: 18px; height: 18px; color: var(--gold); }
.rs-kit.none { color: var(--bone-3); letter-spacing: .14em; text-transform: uppercase; font-size: 10px; }
.rm-keys { font: 500 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--bone-3); }
.rm-keys b { color: var(--bone-2); }
.rm-msg { position: absolute; left: 50%; top: 18vh; transform: translateX(-50%); font: 600 22px var(--display); color: var(--gold); animation: toast 2.6s var(--ease) forwards; pointer-events: none; }

/* dock */
.sh-cards { grid-template-columns: repeat(3, minmax(0, 300px)); justify-content: center; align-content: center; gap: 26px; }
.sh-serv { display: flex; justify-content: center; gap: 14px; }
.sh-serv button { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 18px; align-items: center; border: 1px solid var(--bone-4); padding: 12px 18px; min-width: 210px; transition: border-color .25s, background .25s; }
.sh-serv b { font: 600 18px var(--display); color: var(--bone); }
.sh-serv span:not(.cr) { grid-row: 2; font: 400 12px var(--sans); color: var(--bone-3); }
.sh-serv .cr, .sh-serv kbd { grid-row: span 2; grid-column: 2; justify-self: end; font: 600 15px var(--sans); color: var(--gold); }
.sh-serv button.foc { border-color: var(--signal); background: linear-gradient(90deg, rgba(255,90,31,.08), transparent); }
.sh-serv button.poor { opacity: .4; }

/* sector cleared */
.scr-payout { display: grid; place-items: center; background: rgba(4,5,8,.82); }
.po-box { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 4vw; width: min(1200px, 90vw); align-items: center; }
.po-plate { position: relative; aspect-ratio: 16 / 10; border: 1px solid var(--bone-4); background: radial-gradient(120% 100% at 50% 40%, #0b0d14, #030407); }
.po-plate > svg { width: 100%; height: 100%; display: block; }
.po-plate .route { stroke-dasharray: 9000; stroke-dashoffset: 9000; animation: draw 1.4s .15s var(--ease) forwards; }
.po-stamp { position: absolute; right: 22px; top: 18px; width: 170px; transform: rotate(-8deg); opacity: 0; animation: stampIn .38s .4s cubic-bezier(.3, 1.6, .5, 1) forwards; }
.po-side h2 { font: 600 40px/1.05 var(--display); margin: 8px 0 20px; }
.po-lines { list-style: none; border-top: 1px solid var(--bone-4); }
.po-lines li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--bone-4); font: 400 15px var(--sans); color: var(--bone-2); opacity: 0; animation: fadeIn .3s var(--d) forwards; }
.po-lines b { font: 600 17px var(--sans); color: var(--gold); }
.po-total { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 6px; opacity: 0; animation: fadeIn .4s var(--d) forwards; }
.po-total > span { font: 500 10px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-3); }
.po-total b { font: 600 36px var(--sans); color: var(--gold); }
.po-total .cr i { width: 13px; height: 13px; }
.po-gap { font: 400 13px var(--sans); color: var(--bone-3); margin-bottom: 14px; }
.do-score { font: 400 12px var(--sans); color: var(--bone-3); margin-top: 12px; }
/* the level card: a bottom panel over a dark plate, never over the middle of the board */
.hud-title { top: auto !important; bottom: 108px; transform: translateX(-50%); background: rgba(5,6,10,.86); border: 1px solid var(--bone-4); border-radius: 4px; padding: 16px 30px 14px; min-width: 460px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.hud-title::before { display: none; }
.hud-title.show { animation: cardIn .45s var(--ease) forwards; }
.hud-title.show.gone { animation: none; opacity: 0; transition: opacity .2s; }
@keyframes cardIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.ht-name { font-size: 30px !important; margin-top: 4px !important; text-shadow: none !important; }
.ht-obj { margin-top: 8px !important; }
.ht-keys { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--bone-4); font: 400 12px var(--sans); letter-spacing: .06em; color: var(--bone-2); }
.ht-keys b { color: var(--bone); font-weight: 600; }
.ht-new { align-items: center; }
/* levels: a plain field list beside the grid */
.p-body { grid-template-columns: 300px minmax(0, 1fr) !important; }
.p-fields { display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.fld .fmed { font: 500 11px var(--sans); color: var(--bone-3); font-feature-settings: "tnum" 1; }
.fld .fmed b { color: var(--gold); font-weight: 500; }
.fld.locked { opacity: .35; }
.card .sealed svg { width: 22px !important; height: 22px !important; opacity: .6; }
.card .pn { white-space: normal; overflow: visible; font-size: 14px !important; line-height: 1.15; }
.card .label { align-items: center; min-height: 40px; }
.do-unlock { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 16px 0 4px; padding: 12px 14px; border: 1px solid rgba(127,224,255,.35); background: rgba(127,224,255,.05); }
.do-unlock span { width: 100%; font: 600 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #7FE0FF; }
.do-unlock b { display: inline-flex; align-items: center; gap: 8px; font: 600 16px var(--display); color: var(--bone); }
.do-unlock svg { width: 22px; height: 22px; color: #7FE0FF; }
.do-next { font: 400 12px var(--sans); color: var(--bone-3); margin-top: 8px; }
