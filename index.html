// ---- src/ui/ui.js
'use strict';
// Menus: title, level select ("plates" in code), results, pause, settings, field intros
// ("transmissions" in code). Keyboard (arrows/WASD + Enter/Esc) and mouse throughout.
P.UI = (G) => {
  const root = document.getElementById('ui');
  const U = { cur: null };
  const A = () => G.audio;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const roman = (n) => ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'][n] || n;

  // ---------------------------------------------------------------- progression
  const rec = (p) => P.Save.rec(p.id);
  const done = (p) => { const r = rec(p); return !!(r && r.best != null); };
  // a field opens once 6 of the previous field's 8 plates are charted; inside a field you may
  // skip ahead by one (plate n opens when n-1 or n-2 is charted) — the finale needs everything
  U.fieldUnlocked = (fi) => true || fi === 0 || G.qs.has('unlock') || (P.FIELDS[fi - 1].plates.length > 0 && P.FIELDS[fi - 1].plates.filter(done).length >= Math.min(6, P.FIELDS[fi - 1].plates.length));
  U.plateUnlocked = (f, pi) => {
    return true;   // v2: Training is practice, every level is open
    const fi = P.FIELDS.indexOf(f);
    if (!U.fieldUnlocked(fi)) return false;
    if (G.qs.has('unlock') || pi === 0) return true;
    if (f.plates[pi].finale != null) return P.FIELDS.every((F) => F.plates.every((p) => p === f.plates[pi] || done(p)));
    return done(f.plates[pi - 1]) || (pi >= 2 && done(f.plates[pi - 2]));
  };
  U.deepUnlocked = () => G.qs.has('unlock') || (P.FIELDS[1].plates.length > 0 && P.FIELDS[1].plates.filter(done).length >= 6);
  const nextPlate = () => {
    for (let fi = 0; fi < P.FIELDS.length; fi++) {
      const f = P.FIELDS[fi];
      for (let pi = 0; pi < f.plates.length; pi++) if (!done(f.plates[pi]) && U.plateUnlocked(f, pi)) return f.plates[pi];
    }
    return null;
  };
  const medalCount = (f) => {
    const c = [0, 0, 0, 0, 0];
    for (const p of f.plates) { const r = rec(p); if (r && r.medal) c[r.medal]++; }
    return c;
  };

  // ---------------------------------------------------------------- screen plumbing
  const open = (name, html, opts = {}) => {
    const prev = U.cur;
    if (prev) prev.el.remove();   // swap at once: two layouts never overlap
    const el = document.createElement('div');
    el.className = 'scr scr-' + name + (opts.cls ? ' ' + opts.cls : '');
    el.innerHTML = html;
    root.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    U.cur = { name, el, onKey: opts.onKey, back: opts.back, t0: performance.now() };
    el.querySelectorAll('[data-f]').forEach((b) => {
      b.addEventListener('mouseenter', () => focus(b, true));
      b.addEventListener('click', (e) => { e.stopPropagation(); activate(b); });
    });
    const first = el.querySelector(opts.focus || '[data-f]:not(.locked)') || el.querySelector('[data-f]');
    if (first) focus(first);
    document.body.classList.toggle('menu', true);
    return el;
  };
  U.close = (instant) => {
    if (!U.cur) return;
    const el = U.cur.el;
    if (instant) el.remove();

'use strict';
// Autopilot: receding-horizon random-shooting planner over the real sim. Used to
//  · prove every plate is completable (validation sweep),
//  · calibrate medal times,
//  · fly the attract-mode demo behind the title.
// It is deliberately not optimal — humans should beat it.
P.Bot = (W, opts = {}) => {
  const S = P.Sim;
  const rng = P.rng(opts.seed || 1234);
  const K = opts.plans || 40;           // candidate plans per decision
  const HOR = opts.horizon || 2.2;      // seconds
  const DEC = opts.decide || 24;        // ticks between decisions
  const B = { plan: null, k: 0, cur: { burn: 0, aim: 0, kick: 0 } };
  // margin: never pass closer than margin × horizon (the archivist must not visibly clip a hole)
  const margin = opts.margin || 0;
  const tooClose = (s) => { for (const b of W.bodies) { if (b.type === 'white' || W.def.finale === W.bodies.indexOf(b)) continue; if ((s.x - b.x) ** 2 + (s.y - b.y) ** 2 < (b.rhNow * margin) ** 2) return true; } return false; };

  // plan = list of segments {dur ticks, burn, ang, kick}
  const randSeg = (s, tgt) => {
    const toT = Math.atan2(tgt.y - s.y, tgt.x - s.x);
    const vel = Math.atan2(s.vy, s.vx);
    const r = rng();
    let ang;
    if (r < 0.3) ang = toT + (rng() - 0.5) * 1.2;
    else if (r < 0.5) ang = vel + (rng() < 0.5 ? 0 : Math.PI) + (rng() - 0.5) * 0.6;
    else if (r < 0.7) ang = vel + (rng() < 0.5 ? 1 : -1) * Math.PI / 2 + (rng() - 0.5) * 0.6;
    else ang = rng() * P.TAU;
    // a fling: kick on the next gold span, aimed — toward the target, along/against the motion, or sideways
    const fr = rng();
    const fang = fr < 0.45 ? toT + (rng() - 0.5) * 1.0 : fr < 0.7 ? vel + (rng() - 0.5) * 0.8 : fr < 0.8 ? vel + Math.PI + (rng() - 0.5) * 0.8 : vel + (rng() < 0.5 ? 1 : -1) * Math.PI / 2 + (rng() - 0.5) * 0.8;
    return { dur: Math.floor(12 + rng() * 96), burn: rng() < 0.45 ? 1 : 0, ang, kick: 0, fling: rng() < 0.6 ? 1 : 0, fang };
  };
  const mutate = (plan, s, tgt) => {
    const p = plan.map((g) => ({ ...g }));
    const i = Math.floor(rng() * p.length);
    const m = rng();
    if (m < 0.3) p[i].ang += (rng() - 0.5) * 0.8;
    else if (m < 0.4) { p[i].fang = (p[i].fang || 0) + (rng() - 0.5) * 0.7; p[i].fling = 1; }
    else if (m < 0.6) p[i].dur = Math.max(6, Math.floor(p[i].dur * (0.5 + rng())));
    else if (m < 0.8) p[i].burn = 1 - p[i].burn;
    else p[i] = randSeg(s, tgt);
    return p;
  };

  // an optional dev route: [bodyIndex | [x, y, r?] | 'gate', …] — the line the designer intended
  const route = opts.route || null;
  const stepDone = (s, it) => S.routeDone(W, s, it);
  const routeObj = (it) => (typeof it === 'number' ? { x: W.bodies[it].x, y: W.bodies[it].y, i: it, b: W.bodies[it] } : Array.isArray(it) ? { x: it[0], y: it[1], gate: true, wp: true } : null);
  B.ri = 0;
  const target = (s, ri = B.ri) => {
    if (route) {
      while (ri < route.length && stepDone(s, route[ri])) ri++;
      if (ri < route.length && route[ri] !== 'gate') { const o = routeObj(route[ri]); if (o.b) { o.x = o.b.x; o.y = o.b.y; } return o; }
    }
    if (opts.relic && W.relic && !s.relic) return { x: W.relic.x, y: W.relic.y, gate: true };
    if (s.gateOpen) return { x: W.gate.x, y: W.gate.y, gate: true };
    let best = null, bd = 1e18;
    W.bodies.forEach((b, i) => {
      if (s.charted[i]) return;
      const d = Math.hypot(b.x - s.x, b.y - s.y) - b.scanR * 0.7;
      if (d < bd) { bd = d; best = { x: b.x, y: b.y, i, b }; }
    });
    return best || { x: W.gate.x, y: W.gate.y, gate: true };
  };

  const evalPlan = (s0, plan) => {
    const s = S.cloneShip(s0);
    const steps = Math.floor(HOR * S.HZ);
    let gi = 0, left = plan[0].dur, score = 0, segs = 0, perfects = 0;
    let kicked = false, ri = B.ri;
    const ev = (t) => { if (t === 'segment') segs++; else if (t === 'perfect') perfects++; };
    for (let k = 0; k < steps; k++) {
      const g = gi < plan.length ? plan[gi] : null;
      let inp = g ? { burn: g.burn, aim: S.quantAim(g.ang), kick: g.kick && !kicked ? 1 : 0 } : { burn: 0, aim: 0, kick: 0 };
      if (g && g.fling && !kicked && s.perfectWin >= 0 && s.kickCd <= 0) inp = { burn: 0, aim: S.quantAim(g.fang), kick: 1 };
      if (inp.kick) kicked = true;
      S.step(W, s, inp, ev);
      if (route) while (ri < route.length && stepDone(s, route[ri])) { ri++; score += 6000; }
      if (!s.alive || (margin && tooClose(s))) { S.place(W, s0.t); return { score: -1e7 + k, s }; }
      if (s.done) { S.place(W, s0.t); return { score: (opts.relic && W.relic && !s.relic ? 2e6 : 1e7) - (s.t + s.pen) * 1000, s }; }
      if (g && --left <= 0) { gi++; kicked = false; if (gi < plan.length) left = plan[gi].dur; }
    }
    S.place(W, s0.t);
    // heuristic value of the end state
    const charted = s.charted.filter(Boolean).length;
    score += charted * 4000 + segs * 90 + perfects * 40 + (opts.relic && s.relic ? 9000 : 0);
    const tg = target(s, ri);
    const d = Math.hypot(tg.x - s.x, tg.y - s.y);
    if (tg.gate) score -= d * 2.2;
    else {
      const rr = tg.b.scanR * 0.6;
      score -= Math.max(0, d - rr) * 1.6;
      // reward heading toward the target
      const vt = ((tg.x - s.x) * s.vx + (tg.y - s.y) * s.vy) / (d || 1);
      score += P.clamp(vt, -400, 500) * 0.6;
    }
    score += s.fuel * 6;
    // danger margin: closest approach to any horizon over the coast tail
    const pr = S.predict(W, s, 1.2, B.pbuf, 6);
    if (pr.hit !== -1) score -= 6000;
    const sp = Math.hypot(s.vx, s.vy);
    if (sp > S.VCAP) score -= (sp - S.VCAP) * 2;
    return { score, s };
  };
  B.pbuf = new Float32Array(2000);

  B.decide = (s) => {
    const tg = target(s);
    let best = null, bestScore = -Infinity;
    const cands = [];
    if (B.plan) {
      // shift the remembered plan by DEC ticks
      const p = B.plan.map((g) => ({ ...g }));
      let shift = DEC;
      while (p.length && shift > 0) { const d = Math.min(p[0].dur, shift); p[0].dur -= d; shift -= d; if (p[0].dur <= 0) p.shift(); }
      if (p.length) { cands.push(p); for (let i = 0; i < K * 0.4; i++) cands.push(mutate(p, s, tg)); }
    }
    cands.push([{ dur: 400, burn: 0, ang: 0, kick: 0 }]);
    while (cands.length < K) cands.push([randSeg(s, tg), randSeg(s, tg), randSeg(s, tg)]);
    for (const c of cands) {
      const r = evalPlan(s, c);
      if (r.score > bestScore) { bestScore = r.score; best = c; }
    }
    B.plan = best; B.k = 0;
    B.lastScore = bestScore;
  };

  // per-tick input for the live/headless runner
  B.input = (s) => {
    if (route) while (B.ri < route.length && stepDone(s, route[B.ri])) B.ri++;
    if (s.tick % DEC === 0 || !B.plan) B.decide(s);
    // walk the plan by ticks since decision
    let k = s.tick % DEC, gi = 0;
    while (B.plan && gi < B.plan.length && k >= B.plan[gi].dur) { k -= B.plan[gi].dur; gi++; }
    const g = B.plan && gi < B.plan.length ? B.plan[gi] : null;
    if (!g) return { burn: 0, aim: 0, kick: 0 };
    if (B.flungSeg !== g) B.flungSeg = null;
    if (g.fling && B.flungSeg !== g && s.perfectWin >= 0 && s.kickCd <= 0) { B.flungSeg = g; return { burn: 0, aim: S.quantAim(g.fang), kick: 1 }; }
    const kick = g.kick && k === 0 ? 1 : 0;
    const noise = opts.noise ? (P.hashStr('n' + Math.floor(s.tick / 24)) / 4294967296 - 0.5) * 2 * opts.noise : 0;
    return { burn: g.burn, aim: S.quantAim(g.ang + noise), kick };
  };

  // full headless solve: returns {ok, time, inputs}
  B.solve = (maxT = 150) => {
    const s = S.newShip(W);
    const rec = [];
    while (s.alive && !s.done && s.t < maxT) {
      const inp = B.input(s);
      rec.push(S.encode(inp));
      S.step(W, s, inp, null);
    }
    return { ok: s.done && (!opts.relic || !W.relic || s.relic), relic: s.relic, time: s.t + s.pen, inputs: Uint16Array.from(rec), fuel: s.fuel, dead: !s.alive, deadType: s.dead && s.dead.body != null ? W.bodies[s.dead.body].type : '', charted: s.charted.filter((c, i) => c && W.bodies[i].scan).length };
  };
  return B;
};

// The archivist: the seeded autopilot run that set each plate's medal times. Deterministic, so
// it is regenerated on demand from its seed index rather than shipped as a recording.
P.archivistOpts = (k) => ({ seed: 500 + k * 131, plans: 48 });
// The archivist: the developer-best run that set each plate's medal times, shipped as a recording
// (src/data/medals.js) and replayed tick for tick — the sim is deterministic, so it is exact.
P.Replay = (inputs) => ({ input: (s) => (s.tick < inputs.length ? P.Sim.decode(inputs[s.tick]) : { burn: 0, aim: 0, kick: 0 }) });
P.archivist = (id) => (P.ARCHIVIST && P.ARCHIVIST[id] ? { replay: P.ARCHIVIST[id] } : null);
P.makeAuto = (W, a) => (a && a.replay ? P.Replay(P.Save.unpack(a.replay)) : P.Bot(W, a === true ? {} : a));

// A greedy, reactive "novice" pilot — the human proxy for pacing metrics. It burns toward the
// nearest objective until the coast line would chart it (or reach the open aperture), then lets go
// and waits. Sometimes it lands a fling at periapsis, aimed at whatever comes next.
P.Novice = (W, opts = {}) => {
  const S = P.Sim;
  const rng = P.rng(opts.seed || 5);
  const DEC = opts.decide || 36, skill = opts.kickSkill == null ? 0.5 : opts.kickSkill, noise = opts.noise == null ? 0.12 : opts.noise;
  const buf = new Float32Array(6000);
  const N = { cur: { burn: 0, aim: 0, kick: 0 } };
  const objectives = (s) => {
    const out = [];
    W.bodies.forEach((b, i) => { if (b.scan && !s.charted[i]) out.push({ x: b.x, y: b.y, i, b }); });
    if (s.gateOpen || (W.needCharts && s.charted.filter(Boolean).length >= W.needCharts)) return [{ x: W.gate.x, y: W.gate.y, gate: true }];
    if (W.needCharts) {
      // a novice charts the nearest ones
      out.sort((a, c) => Math.hypot(a.x - s.x, a.y - s.y) - Math.hypot(c.x - s.x, c.y - s.y));
    }
    return out.length ? out : [{ x: W.gate.x, y: W.gate.y, gate: true }];
  };
  const nearest = (s, list) => list.reduce((a, c) => (Math.hypot(c.x - s.x, c.y - s.y) - (c.b ? c.b.scanR : 0) < Math.hypot(a.x - s.x, a.y - s.y) - (a.b ? a.b.scanR : 0) ? c : a));
  N.input = (s) => {
    let kick = 0;
    if (s.tick % DEC === 0) {
      const list = objectives(s), tg = nearest(s, list);
      const res = S.predict(W, s, 2.4, buf, 4);
      let good = false;
      if (res.hit === -1) {
        if (tg.gate) { for (let k = 0; k < res.n; k++) if ((buf[k * 2] - tg.x) ** 2 + (buf[k * 2 + 1] - tg.y) ** 2 < (W.gate.r * 0.8) ** 2) { good = true; break; } }
        else { const L = res.lit[tg.i]; let c = 0; if (L) for (let k = 0; k < L.length; k++) c += L[k]; good = c >= tg.b.need; }
      }
      if (res.hit !== -1 && res.hit >= 0) {
        // the line ends in red: steer out — away from the hole and along the way you're going
        // (sideways: braking straight back never saves you — tangential speed does)
        const hb = W.bodies[res.hit], dx = s.x - hb.x, dy = s.y - hb.y, d = Math.hypot(dx, dy) || 1;
        const side = Math.sign(-dy * s.vx + dx * s.vy) || 1;
        N.cur = { burn: s.fuel > 0 ? 1 : 0, aim: S.quantAim(Math.atan2(dx / d * side + dy / d * 0.3, -dy / d * side + dx / d * 0.3)), kick: 0 };
      } else if (good) N.cur = { burn: 0, aim: N.cur.aim, kick: 0 };
      else {
        // head for a point on the side of the ring the probe is already passing
        const dx = tg.x - s.x, dy = tg.y - s.y, d = Math.hypot(dx, dy) || 1;
        const side = Math.sign(s.vx * dy - s.vy * dx) || 1;
        const off = tg.gate || tg.b.type === 'white' ? 0 : tg.b.scanR * 0.55;
        const ax = tg.x + (dy / d) * off * side, ay = tg.y - (dx / d) * off * side;
        const ad = Math.hypot(ax - s.x, ay - s.y) || 1, sp = Math.max(Math.hypot(s.vx, s.vy), 650);
        const ex = (ax - s.x) / ad * sp - s.vx, ey = (ay - s.y) / ad * sp - s.vy;
        const burn = Math.hypot(ex, ey) > 90 && s.fuel > 0 ? 1 : 0;
        N.cur = { burn, aim: S.quantAim(Math.atan2(ey, ex) + (rng() - 0.5) * 2 * noise), kick: 0 };
      }
    }
    // a fling at periapsis toward the next objective, when the novice remembers to
    if (s.perfectWin >= 0 && s.kickCd <= 0 && !N.tried) {
      N.tried = true;
      if (rng() < skill) {
        const list = objectives(s).filter((o) => o.i !== s.perfectWin);
        const nx = list.length ? nearest(s, list) : { x: W.gate.x, y: W.gate.y };
        const aim = S.quantAim(Math.atan2(nx.y - s.y, nx.x - s.x) + (rng() - 0.5) * noise);
        // a human sees the fling preview: never kick into a red line
        const kv = S.kickVec(W, s, S.aimAngle(aim), true);
        const pr = S.predict(W, { x: s.x, y: s.y, vx: s.vx + kv[0], vy: s.vy + kv[1], t: s.t, charted: s.charted, lit: s.lit, worm: 0, gateOpen: s.gateOpen, rocks: s.rocks }, 1.5, buf, 4);
        if (pr.hit === -1) return { burn: 0, aim, kick: 1 };
      }
    }
    if (s.perfectWin < 0) N.tried = false;
    return N.cur;
  };
  N.solve = (maxT = 90) => {
    const s = S.newShip(W), rec = [];
    while (s.alive && !s.done && s.t < maxT) { const inp = N.input(s); rec.push(S.encode(inp)); S.step(W, s, inp, null); }
    return { ok: s.done, time: s.t + s.pen, inputs: Uint16Array.from(rec), fuel: s.fuel, dead: !s.alive, charted: s.charted.filter((c, i) => c && W.bodies[i].scan).length };
  };
  return N;
};

// Local search over a finished run's inputs: nudges segment boundaries, aims, burns and kick
// timings, keeping any change that finishes sooner. Turns a decent autopilot line into a tight one
// (precise flings, shaved burns) — the medal times are set from this, like a developer's best.
P.Polish = (def, inputs, opts = {}) => {
  const S = P.Sim, rng = P.rng(opts.seed || 17), iters = opts.iters || 1500;
  const W = S.build(def);
  const margin = opts.margin || 0;
  const close = (s) => { for (let i = 0; i < W.bodies.length; i++) { const b = W.bodies[i]; if (b.type === 'white' || W.def.finale === i) continue; if ((s.x - b.x) ** 2 + (s.y - b.y) ** 2 < (b.rhNow * margin) ** 2) return true; } return false; };
  const needRelic = !!opts.relic;
  // inputs → segments (burn/aim/thr runs) + kicks
  const segs = [], kicks = [];
  for (let i = 0; i < inputs.length; i++) {
    const d = S.decode(inputs[i]);
    if (d.kick) kicks.push({ t: i, aim: d.aim });
    const last = segs[segs.length - 1];
    if (last && last.burn === d.burn && (last.aim === d.aim || !d.burn) && last.thr === d.thr) last.dur++;
    else segs.push({ dur: 1, burn: d.burn, aim: d.aim, thr: d.thr });
  }
  const render = (sg, kk) => {
    let n = 0; for (const g of sg) n += g.dur;
    const out = new Uint16Array(n); let k = 0;
    for (const g of sg) { const v = S.encode({ burn: g.burn, kick: 0, aim: g.aim, thr: g.thr }); out.fill(v, k, k + g.dur); k += g.dur; }
    for (const q of kk) if (q.t >= 0 && q.t < n) { const d = S.decode(out[q.t]); out[q.t] = S.encode({ burn: d.burn, kick: 1, aim: q.aim, thr: d.thr }); }
    return out;
  };
  const SNAP = 48;
  let snaps = [];
  const run = (arr, from, record) => {
    // start from the best run's snapshot at or before `from`
    let si = Math.min(Math.floor(from / SNAP), snaps.length - 1);
    let s = si >= 0 && snaps[si] ? S.cloneShip(snaps[si]) : S.newShip(W);
    if (record) snaps = [];
    const lim = arr.length + S.HZ * 3;
    while (s.alive && !s.done && s.tick < lim) {
      if (record && s.tick % SNAP === 0) snaps[s.tick / SNAP] = S.cloneShip(s);
      const v = s.tick < arr.length ? arr[s.tick] : 0;
      S.step(W, s, S.decode(v), null);
      if (margin && close(s)) return { t: Infinity };
    }
    if (!s.done || (needRelic && W.relic && !s.relic)) return { t: Infinity };
    return { t: s.t + s.pen, ticks: s.tick };
  };
  let cur = { segs, kicks };
  let arr = render(segs, kicks);
  let best = run(arr, 0, true);
  if (!isFinite(best.t)) return { time: Infinity, inputs };
  const gauss = () => (rng() + rng() + rng() - 1.5) * 1.15;
  for (let it = 0; it < iters; it++) {
    const sg = cur.segs.map((g) => ({ ...g })), kk = cur.kicks.map((q) => ({ ...q }));
    const nm = 1 + (rng() < 0.3 ? 1 : 0);
    for (let m = 0; m < nm; m++) {
      const r = rng(), i = Math.floor(rng() * sg.length);
      if (r < 0.22) sg[i].aim = ((sg[i].aim + Math.round(gauss() * 40)) % 1024 + 1024) % 1024;
      else if (r < 0.44 && i < sg.length - 1) { const d = Math.round(gauss() * 18) || 1; if (sg[i].dur + d > 0 && sg[i + 1].dur - d > 0) { sg[i].dur += d; sg[i + 1].dur -= d; } }
      else if (r < 0.52) sg[i].burn = 1 - sg[i].burn;
      else if (r < 0.6 && sg[i].dur > 8) { const c = 1 + Math.floor(rng() * (sg[i].dur - 1)); sg.splice(i + 1, 0, { ...sg[i], dur: sg[i].dur - c, burn: 1 - sg[i].burn }); sg[i].dur = c; }
      else if (r < 0.66 && i < sg.length - 1) { sg[i].dur += sg[i + 1].dur; sg.splice(i + 1, 1); }
      else if (r < 0.72) { sg[sg.length - 1].dur = Math.max(1, sg[sg.length - 1].dur - Math.floor(rng() * 40)); }
      else if (kk.length && r < 0.84) { const q = kk[Math.floor(rng() * kk.length)]; q.t += Math.round(gauss() * 14); }
      else if (kk.length && r < 0.93) { const q = kk[Math.floor(rng() * kk.length)]; q.aim = ((q.aim + Math.round(gauss() * 50)) % 1024 + 1024) % 1024; }
      else if (r < 0.97) kk.push({ t: Math.floor(rng() * best.ticks), aim: Math.floor(rng() * 1024) });
      else if (kk.length) kk.splice(Math.floor(rng() * kk.length), 1);
    }
    const na = render(sg, kk);
    let from = 0; const L = Math.min(na.length, arr.length);
    while (from < L && na[from] === arr[from]) from++;
    if (from >= L && na.length === arr.length) continue;
    const r2 = run(na, from, false);
    if (r2.t < best.t - 1e-9 || (r2.t <= best.t + 1e-9 && na.length < arr.length)) {
      cur = { segs: sg, kicks: kk }; arr = na;
      best = run(arr, 0, true);
    }
  }
  // trim the tail the run never reached
  const outArr = new Uint16Array(best.ticks); outArr.set(arr.subarray(0, Math.min(arr.length, best.ticks)));
  return { time: best.t, inputs: outArr };
};

// The expert: a beam search over the decisions that matter in this game — at every gold span,
// where to fling (or not); after every fling or chart, how to steer (a short burn toward the
// next ring's edge, or none) — then coast to the next decision. Its lines look like a skilled
// player's: one fling per well, few burns. Used for dev runs (medal times, archivist recordings).
P.Expert = (W, opts = {}) => {
  const S = P.Sim;
  const route = opts.route || null;
  const BEAM = opts.beam || 18, SEG = opts.seg || 1.0, VREF = 1050, MAXT = opts.maxT || 40;
  const margin = opts.margin || 0;
  const scanIdx = W.bodies.map((b, i) => (b.scan ? i : -1)).filter((i) => i >= 0);
  const needK = W.needCharts || scanIdx.length;
  const stepDone = (s, it) => (typeof it === 'number' ? s.charted[it] : Array.isArray(it) ? false : false);
  // the sequence of points still to visit (route first, else nearest-first), ending at the gate
  const plan = (s, ri) => {
    const pts = [];
    let x = s.x, y = s.y;
    if (route) {
      for (let k = ri; k < route.length; k++) {
        const it = route[k];
        if (it === 'gate') break;
        if (typeof it === 'number') { if (!s.charted[it]) { const b = W.bodies[it]; pts.push({ x: b.x, y: b.y, r: b.scanR * 0.7, b }); } }
        else pts.push({ x: it[0], y: it[1], r: (it[2] || 150) * 0.5, wp: true });
      }
    } else {
      let have = s.charted.filter((c, i) => c && W.bodies[i].scan).length;
      const left = scanIdx.filter((i) => !s.charted[i]);
      while (have < needK && left.length) {
        left.sort((a, b) => Math.hypot(W.bodies[a].x - x, W.bodies[a].y - y) - Math.hypot(W.bodies[b].x - x, W.bodies[b].y - y));
        const i = left.shift(), b = W.bodies[i]; pts.push({ x: b.x, y: b.y, r: b.scanR * 0.7, b }); x = b.x; y = b.y; have++;
      }
    }
    pts.push({ x: W.gate.x, y: W.gate.y, r: 0, gate: true });
    return pts;
  };
  const est = (s, ri) => {
    const pts = plan(s, ri);
    let d = 0, x = s.x, y = s.y;
    for (let k = 0; k < pts.length; k++) { d += Math.max(0, Math.hypot(pts[k].x - x, pts[k].y - y) - pts[k].r); x = pts[k].x; y = pts[k].y; }
    const p = pts[0], dx = p.x - s.x, dy = p.y - s.y, dd = Math.hypot(dx, dy) || 1;
    const along = (s.vx * dx + s.vy * dy) / dd;
    // partial credit for a ring already half-painted
    let part = 0;
    if (p.b) { const i = W.bodies.indexOf(p.b); part = Math.min(1, s.litN[i] / p.b.need) * 0.35; }
    return d / VREF + Math.max(0, (VREF - along)) / VREF * 0.25 - part;
  };
  const advance = (s, ri) => { if (route) while (ri < route.length && route[ri] !== 'gate' && S.routeDone(W, s, route[ri])) ri++; return ri; };
  const tooClose = (s) => { if (!margin) return false; for (let i = 0; i < W.bodies.length; i++) { const b = W.bodies[i]; if (b.type === 'white' || W.def.finale === i) continue; if ((s.x - b.x) ** 2 + (s.y - b.y) ** 2 < (b.rhNow * margin) ** 2) return true; } return false; };
  // steering options from a state: none, or burn toward an aim point for a duration
  const steerOpts = (s, ri) => {
    const pts = plan(s, ri), p = pts[0];
    const out = [null];
    const dx = p.x - s.x, dy = p.y - s.y, d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
    const aims = [];
    const off = p.b ? p.b.scanR * 0.62 : 0;
    for (const o of p.b ? [-off, 0, off] : [0]) {
      const ax = p.x + nx * o, ay = p.y + ny * o;
      // burn so the velocity swings toward the aim point
      const sp = Math.max(Math.hypot(s.vx, s.vy), 500), ad = Math.hypot(ax - s.x, ay - s.y) || 1;
      aims.push(Math.atan2((ay - s.y) / ad * sp - s.vy, (ax - s.x) / ad * sp - s.vx));
    }
    const va = Math.atan2(s.vy, s.vx);
    aims.push(va + Math.PI / 2, va - Math.PI / 2, va + Math.PI);
    for (const a of aims) for (const dur of [0.12, 0.3, 0.6, 1.1]) out.push({ a, n: Math.round(dur * S.HZ) });
    return out;
  };
  const flingOpts = (s, ri) => {
    const pts = plan(s, ri), out = [null];
    const va = Math.atan2(s.vy, s.vx);
    for (let k = -4; k <= 4; k++) out.push(va + k * 0.32);
    for (const p of pts.slice(0, 2)) {
      const base = Math.atan2(p.y - s.y, p.x - s.x);
      for (const o of [-0.25, 0, 0.25]) out.push(base + o);
    }
    out.push(va + Math.PI);
    return out;
  };
  const code = (burn, aim, kick) => S.encode({ burn, kick, aim: S.quantAim(aim), thr: 0 });
  // simulate one action from node; returns the child node
  const roll = (node, fling, steer) => {
    const s = S.cloneShip(node.s);
    const runs = [];
    const push = (v) => { const l = runs[runs.length - 1]; if (l && l[0] === v) l[1]++; else runs.push([v, 1]); };
    let charts = s.charted.filter(Boolean).length, gate = s.gateOpen, ri = node.ri;
    const t0 = s.t;
    let k = 0, leftWin = s.perfectWin < 0, events = 0;
    const lim = Math.round(SEG * S.HZ);
    while (k < lim && s.alive && !s.done) {
      let inp;
      if (k === 0 && fling != null) inp = code(0, fling, 1);
      else if (steer && k < steer.n + (fling != null ? 1 : 0)) inp = code(1, steer.a, 0);
      else inp = 0;
      push(inp);
      S.step(W, s, S.decode(inp), null);
      k++;
      if (tooClose(s)) { s.alive = false; break; }
      if (s.perfectWin < 0) leftWin = true;
      const c2 = s.charted.filter(Boolean).length;
      ri = advance(s, ri);
      // decision points: a new gold span, a chart, the aperture opening, a waypoint reached
      if ((leftWin && s.perfectWin >= 0 && s.kickCd <= 0) || c2 > charts || s.gateOpen !== gate || ri !== node.ri) { if (k > 6) break; }
    }
    const done = s.done, dead = !s.alive;
    const score = done ? -(s.t + s.pen) + 1000 : dead ? -1e6 : -(s.t + s.pen + est(s, ri));
    return { s, ri, runs: node.runs.concat(runs), score, done, dead };
  };
  const E = {};
  E.solve = () => {
    let beam = [{ s: S.newShip(W), ri: 0, runs: [], score: 0 }];
    beam[0].ri = advance(beam[0].s, 0);
    let best = null;
    for (let layer = 0; layer < 200 && beam.length; layer++) {
      const kids = [];
      for (const node of beam) {
        const inWin = node.s.perfectWin >= 0 && node.s.kickCd <= 0;
        const fl = inWin ? flingOpts(node.s, node.ri) : [null];
        const st = steerOpts(node.s, node.ri);
        for (const f of fl) for (const g of (f != null ? st.filter((x, i) => i === 0 || i % 2 === 1) : st)) {
          const c = roll(node, f, g);
          if (c.dead) continue;
          if (c.done) { if (!best || c.s.t + c.s.pen < best.t) best = { t: c.s.t + c.s.pen, runs: c.runs, s: c.s }; continue; }
          if (c.s.t > MAXT || (best && c.s.t + c.s.pen > best.t)) continue;
          kids.push(c);
        }
      }
      // keep the best per coarse state cell, then the top of those
      kids.sort((a, b) => b.score - a.score);
      const seen = new Set(); beam = [];
      for (const c of kids) {
        const s = c.s, key = s.charted.map((x) => (x ? 1 : 0)).join('') + c.ri + '|' + Math.floor(s.x / 110) + ',' + Math.floor(s.y / 110) + '|' + Math.floor((Math.atan2(s.vy, s.vx) + Math.PI) / (Math.PI / 6));
        if (seen.has(key)) continue;
        seen.add(key); beam.push(c);
        if (beam.length >= BEAM) break;
      }
    }
    if (!best) return { ok: false, time: Infinity, inputs: new Uint16Array(0) };
    let n = 0; for (const [, c] of best.runs) n += c;
    const inputs = new Uint16Array(n); let o = 0;
    for (const [v, c] of best.runs) { inputs.fill(v, o, o + c); o += c; }
    return { ok: true, time: best.t, inputs, relic: best.s.relic };
  };
  return E;
};

'use strict';
// THE RUN — the roguelike. Three zones, each a small branching map of sectors that ends in a boss.
// You fly a sector, its time earns a medal, the medal earns credits; at docks you spend credits on
// ship upgrades (probes among them). Falling into a black hole costs one hull and restarts the
// sector; lose all your hull and the run is over. Every generated sector is flown by the autopilot
// before you see it, so it is always possible.
P.Run = (() => {
  const RN = {};
  const S = P.Sim;

  // ------------------------------------------------------------------ upgrades
  // cost in credits; `needs` = another upgrade that must be owned first; `max` = how many you can stack
  RN.UPGRADES = [
    { id: 'probes', tag: 'probe', name: 'Probe Bay', cost: 28, glyph: 'probe', desc: 'Tap <b>E</b> and a probe peels away along your dashed line, mapping every ring it passes. One a sector.', apply: (r) => { r.mods.probes += 1; } },
    { id: 'probe+', tag: 'probe', name: 'Extra Probe', cost: 21, glyph: 'probe', needs: 'probes', max: 1, desc: 'A second probe racked in the bay, every sector.', apply: (r) => { r.mods.probes += 1; } },
    { id: 'orbit', tag: 'probe', name: 'Orbit Lock', cost: 34, glyph: 'orbit', needs: 'probes', desc: 'Probes that reach an unmapped ring fire a retro-burn, settle into orbit and map the whole circle while you fly on.', apply: (r) => { r.mods.probeOrbit = 1; r.mods.probeLife *= 1.3; } },
    { id: 'shield', tag: 'ship', name: 'Shield', cost: 34, glyph: 'shield', max: 2, desc: 'A field generator that throws you back off an event horizon once per sector, instead of letting it swallow you.', apply: (r) => { r.mods.shield += 1; } },
    { id: 'plating', tag: 'ship', name: 'Hull Plating', cost: 25, glyph: 'hull', max: 2, desc: 'A fresh plate of hull bolted over the old ones: <b>+1 max hull</b>, and one repaired.', apply: (r) => { r.hullMax += 1; r.hull = Math.min(r.hullMax, r.hull + 1); } },
    { id: 'rings', tag: 'fling', name: 'Deep Diver', cost: 29, glyph: 'wide', desc: 'Skim within a hair of an event horizon and the <b>whole ring maps at once</b>. The brave line is the short one.', apply: (r) => { r.mods.diveMap = 1.9; } },
    { id: 'quick', tag: 'ship', name: 'Quick Mapping', cost: 29, glyph: 'coarse', desc: 'Sharper sensors: a black hole is mapped with <b>a quarter less</b> of its ring lit.', apply: (r) => { r.mods.need *= 0.75; } },

      let node = RN.reachable(run)[qs.get('j') ? +qs.get('j') : 0];
      if (qs.has('boss')) { const z = +(qs.get('zone') || 2); node = { id: z + '-' + RN.COLS + '-0', zone: z, col: RN.COLS, j: 0, type: 'boss' }; }
      if (qs.get('col')) node.col = +qs.get('col');
      if (qs.get('zone') && !qs.has('boss')) { node.zone = +qs.get('zone'); node.id = node.zone + '-' + node.col + '-' + node.j; }
      const def = await RN.makeAsync(run, node);
      G.ui.close();
      if (qs.has('die')) RN.fly(G, node, def, false); else G.playPlate(def, { deep: true, run, auto: { seed: 5 }, onFinish: () => {} });
      const times = (qs.get('drops') || '0.4,1.2').split(',').map(Number);
      for (const t of times) setTimeout(() => { if (G.scene) G.scene.probeQ = true; }, 900 + t * 1000);
      if (qs.has('die')) setTimeout(() => { const sc = G.scene, b = sc.W.bodies.find((x) => x.type === 'hole'); sc.s.x = b.x + b.rhNow * 0.5; sc.s.y = b.y; }, 2500);
      console.log('PROBEDEMO_OK');
    })();
  }
  if (mode === 'runui') {
    // every run screen in turn, for screenshots: start 0s · map 3s · shop 7s · payout 10s · over 13s · hud 16s
    (async () => {
      const w = (ms) => new Promise((r) => setTimeout(r, ms));
      const RN = P.Run;
      RN.start(G, 4242);
      await w(3000);
      const run = RN.cur;
      RN.UPGRADES[0].apply(run); run.taken.push('probes'); run.credits = 41;
      G.ui.runMap(run);
      await w(4000);
      G.ui.shop(run, () => {});
      await w(3000);
      const node = RN.reachable(run)[0];
      const def = await RN.makeAsync(run, node);
      const sc = P.Play(G, def, { deep: true, run, auto: { seed: 3 } });
      const r = P.Bot(P.Sim.build(def), { seed: 5 }).solve(40);
      const res = { time: r.time || 6.2, route: [], perfects: [], routeBurn: [], routeSpd: [] };
      run.credits += 23;
      G.ui.runPayout(run, { node, def, res, medal: 3, lines: [{ k: 'gold — ' + P.fmtTime(res.time), v: 15 }, { k: 'credit chips × 2', v: 6 }, { k: 'savings — 1 per 8 credits held', v: 2 }], gain: 23 }, () => {});
      await w(3000);
      run.stats.sectors = 6; run.stats.golds = 3; run.earned = 96; run.zone = 1;
      G.ui.runOver(run, { why: 'You fell into a black hole', won: false, score: 104, best: true });
      await w(3000);
      G.ui.close();
      RN.fly(G, node, def, false);
      console.log('RUNUI_OK');
    })();
  }
  if (mode === 'run') {
    // the autopilot plays whole runs through the real UI (use with &autoplay=1): picks, map, docks
    (async () => {
      const w = (ms) => new Promise((r) => setTimeout(r, ms));
      const runs = +(qs.get('runs') || 1);
      const rng = P.rng(+(qs.get('seed') || 3));
      for (let k = 0; k < runs; k++) {
        P.Run.start(G, 1000 + k);
        let last = '', t0 = performance.now(), sectors = 0;
        while (performance.now() - t0 < 1500000) {
          await w(200);
          const cur = G.ui.cur && G.ui.cur.name;
          const run = P.Run.cur;
          const tag = (cur || 'play') + ':' + (G.scene && G.scene.def ? G.scene.def.id : '');
          if (tag !== last) { last = tag; if (cur === 'payout') { sectors++; console.log(`RUN ${k} ${G.scene.def.id} t=${G.scene.result ? G.scene.result.time.toFixed(2) : '?'} bot=${G.scene.def.botTime ? G.scene.def.botTime.toFixed(2) : '-'} medals=${JSON.stringify(G.scene.def.medals)} credits=${run.credits} hull=${run.hull} taken=${run.taken.join(',')}`); } }
          if (!cur) continue;
          const el = G.ui.cur.el;
          if (cur === 'deepover') { console.log(`RUNOVER ${k} ${el.querySelector('h2').textContent} zone=${run ? run.zone + 1 : '?'} sectors=${sectors} ${el.querySelector('.do-big b').textContent}`); break; }
          if (cur === 'runstart') { await w(400); el.querySelector('.rn-launch')._act(); continue; }
          if (cur === 'runmap') { const r = [...el.querySelectorAll('.mn.reach')]; const b = r[Math.floor(rng() * r.length)]; await w(400); b && b._act(); continue; }
          if (cur === 'shop') { const dr = el.querySelector('.sh-drop'); if (dr) { dr._act(); continue; } const c = [...el.querySelectorAll('.dr-card:not(.poor):not(.sold)')]; if (c.length) c[0]._act(); else el.querySelector('.sh-leave')._act(); continue; }
          if (cur === 'payout') { await w(600); el.querySelector('.po-go')._act(); continue; }
          if (cur === 'event') { await w(300); const c = el.querySelector('.ev-c:not(.poor)'); c && c._act(); await w(300); const g = el.querySelector('.ev-go'); g && g._act(); continue; }
        }
      }
      console.log('RUN_OK');
    })();
  }
  if (mode === 'campaign') {
    // the autopilot plays the whole campaign through the real UI, transmissions to credits
    (async () => {
      const w = (ms) => new Promise((r) => setTimeout(r, ms));
      const seen = []; let last = ''; const t0 = performance.now();
      while (performance.now() - t0 < 3000000) {
        await w(250);
        const cur = G.ui.cur && G.ui.cur.name;
        const tag = (cur || 'play') + ':' + (G.scene && G.scene.def ? G.scene.def.id : '');
        if (tag !== last) { seen.push(tag); last = tag; if (cur === 'results') console.log('CAMP ' + tag + ' ' + Math.round((performance.now() - t0) / 1000) + 's'); }
        if (cur === 'credits') break;
        if (cur === 'title') { G.ui.startPlate(P.FIELDS.flatMap((f) => f.plates).find((p) => !P.Save.rec(p.id)) || P.FIELDS[0].plates[0]); continue; }
        const b = cur && G.ui.cur.el.querySelector({ tx: '.tx-go', results: '.r-next' }[cur] || '.none');
        if (b && b._act) b._act();
      }
      console.log('CAMPJSON ' + JSON.stringify({ results: seen.filter((x) => x.startsWith('results')).length, tx: seen.filter((x) => x.startsWith('tx')).length, end: seen.slice(-3) }));
      console.log('CAMPAIGN_OK');
    })();
  }
  if (mode === 'ending') {
    // fake a finished archive using autopilot runs as the saved ghosts, then show credits
    for (const f of P.FIELDS) for (const def of f.plates) {
      const r = P.Bot(P.Sim.build(def), { seed: 3 }).solve(60);
      if (r.ok) P.Save.submit(def, { time: r.time, inputs: r.inputs });
    }
    G.ui.credits();
    console.log('ENDING_OK');
    if (qs.has('export')) P.savePlatePNG(P.lacunaFinalSVG(), 'The Lacuna, charted', 'test', 'x.png');
  }
  if (mode === 'papertx') { G.playPlate(P.findPlate('VIII-8')); G.ui.transmission(P.STORY.END, () => {}, { paper: true }); }
  if (mode === 'ship') {
    // probe close-up: parked, then burning
    G.playPlate(P.findPlate('I-1'));
    const sc = G.scene; sc.firstEntry = false;
    setTimeout(() => { sc.phase = 'fly'; sc.launched = true; P.Input.mdown[0] = true; P.Input.device = 'mouse'; P.Input.mx = 1300; P.Input.my = 300; }, 900);
  }
  if (mode === 'watch') {
    const def = P.findPlate(qs.get('plate') || 'I-3');
    G.playPlate(def, { auto: P.archivist(def.id), watch: true, ghost: null, onFinish: (r) => { console.log('WATCH ' + def.id + ' ' + r.time.toFixed(3)); console.log('WATCH_OK'); } });
  }
  if (mode === 'human') {
    // handicapped autopilot as a rough human proxy: clear rate per plate
    const rows = [];
    const seeds = +(qs.get('seeds') || 6);
    const only = qs.get('plate') ? qs.get('plate').split(',') : null;
    for (const f of P.FIELDS) for (const def of f.plates) {
      if (only && !only.includes(def.id)) continue;
      let ok = 0, tsum = 0; const why = [];
      for (let k = 0; k < seeds; k++) {
        const W0 = P.Sim.build(def);
        const r = P.Bot(W0, { seed: 900 + k * 71, plans: 16, decide: 60, noise: 0.14 }).solve(90);
        if (r.ok) { ok++; tsum += r.time; }
        else why.push(r.dead ? 'D' + (r.deadType || '') : (r.fuel < 1 ? 'dry' : 'T') + r.charted + '/' + W0.bodies.filter((b) => b.scan).length);
      }
      rows.push(def.id + ' ' + ok + '/' + seeds + (ok ? ' ' + (tsum / ok).toFixed(1) + 's' : '') + ' [' + why.join(' ') + ']');
      console.log('HUM ' + rows[rows.length - 1]);
    }
    console.log('HUMAN_OK');
  }
  if (mode === 'replay') {
    let bad = 0;
    for (const f of P.FIELDS) for (const def of f.plates) {
      const W = P.Sim.build(def);
      const r = P.Bot(W, { seed: 99 }).solve(def.maxT || 150);
      if (!r.ok) { console.log('REPLAY skip ' + def.id); continue; }
      // round-trip through the save packer too
      const inp = P.Save.unpack(P.Save.pack(r.inputs));
      const W2 = P.Sim.build(def); const s = P.Sim.newShip(W2);
      for (let k = 0; k < inp.length && s.alive && !s.done; k++) { const v = inp[k]; P.Sim.step(W2, s, P.Sim.decode(v), null); }
      const ok = s.done && Math.abs(s.t + s.pen - r.time) < 1e-9;
      if (!ok) bad++;
      console.log('REPLAY ' + def.id + ' ' + (ok ? 'ok' : 'MISMATCH') + ' ' + r.time.toFixed(4) + ' vs ' + s.t.toFixed(4));
    }
    console.log(bad ? 'TEST_FAIL replay ' + bad : 'REPLAY_OK');
  }
  if (mode === 'bot' || mode === 'botall') {
    const ids = mode === 'bot' ? (qs.get('plate') || 'I-1').split(',') : P.FIELDS.flatMap((f) => f.plates.map((p) => p.id));
    let fails = 0;
    for (const id of ids) {
      const def = P.findPlate(id);
      const tries = +(qs.get('tries') || 3);
      let best = null;
      for (let k = 0; k < tries; k++) {
        const W = P.Sim.build(def);
        const t0 = performance.now();
        const r = P.Bot(W, { seed: 1000 + k * 77 }).solve(def.maxT || 150);
        r.ms = Math.round(performance.now() - t0);
        if (r.ok && (!best || r.time < best.time)) best = r;
        if (!best && k === tries - 1) best = r;
      }
      if (!best.ok) fails++;
      const m = def.medals || [];
      console.log(`BOT ${id.padEnd(6)} ${best.ok ? 'OK  ' : 'FAIL'} t=${best.time.toFixed(2)} fuel=${best.fuel.toFixed(0)} charted=${best.charted} ${best.dead ? 'DEAD' : ''} medals=${m.join('/')} (${best.ms}ms)`);
    }
    console.log(fails ? 'TEST_FAIL bot ' + fails : 'BOT_OK');
  }
};

'use strict';
// Boot + main loop + scene switching.
(() => {
  const qs = new URLSearchParams(location.search);
  P.TESTMODE = qs.has('test') || qs.has('shot');
  const G = (P.G = {
    waves: [], scene: null, time: 0, qs,
    settings: Object.assign({ shake: 1, fxScale: 1, flashScale: 1, predict: 2.2, music: 0.8, sfx: 0.9, quality: 1, ghost: true }, P.Save.settings()),
  });

  const boot = () => {
    const glc = document.getElementById('gl');
    G.R = P.Renderer(glc);
    if (!G.R) { document.getElementById('nogl').classList.add('on'); return; }
    G.ink = P.Ink(document.getElementById('ink'));
    G.hud = P.HUD(document.getElementById('hud'));
    G.audio = P.Audio ? P.Audio(G) : null;
    G.ui = P.UI ? P.UI(G) : null;
    addEventListener('resize', () => { G.R.resize(); G.ink.resize(G.R.dpr); });
    G.ink.resize(G.R.dpr);

    const plateId = qs.get('plate');
    if (plateId && P.findPlate(plateId)) G.playPlate(P.findPlate(plateId));
    else if (G.ui) G.ui.title();
    else G.playPlate(P.FIELDS[0].plates[0]);

    if (qs.has('record')) { G.frame = (n = 1, dt = 1 / 30) => { for (let i = 0; i < n; i++) tick(dt); return true; }; if (P.Tests) P.Tests(G); return; }
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      tick(dt);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    if (P.Tests) P.Tests(G);
  };

  // auto-pause when the window loses focus mid-flight
  const autoPause = () => {
    const sc = G.scene;
    if (sc && sc.def && !sc.menu && sc.phase === 'fly' && !G.paused && G.ui && !G.ui.cur && !P.TESTMODE && !qs.has('demo')) G.ui.pause();
  };
  addEventListener('blur', autoPause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
  G.perf = { n: 0, cpu: 0, max: 0 };
  const tick = (dt) => {
    const c0 = performance.now();
    G.time += dt;
    for (const w of G.waves) { w.life -= dt; w.r += dt * 1500; }
    G.waves = G.waves.filter((w) => w.life > 0);
    P.Input.pollPad(!!(G.ui && G.ui.cur));
    if (G.scene) {
      if (!G.paused) G.scene.update(dt);
      G.scene.draw(G.ink);
    }
    G.audio && G.audio.tick && G.audio.tick(dt);
    P.Input.endFrame();
    const c = performance.now() - c0;
    G.perf.n++; G.perf.cpu += c; G.perf.max = Math.max(G.perf.max, c);
  };
  G.tick = tick;

  // shutter: a quick plate-change wipe that hides the scene swap
  G.shutter = (fn) => {
    const sh = document.getElementById('shutter');
    if (!sh || P.TESTMODE) { fn(); return; }
    sh.classList.remove('open'); sh.classList.add('close');
    setTimeout(() => { fn(); sh.classList.remove('close'); sh.classList.add('open'); }, 190);
  };
  G.playPlate = (def, opts = {}) => {
    if (!opts._noShutter && G.scene && G.scene.def && !G.scene.menu) { G.shutter(() => G.playPlate(def, Object.assign({}, opts, { _noShutter: true }))); return; }
    const ghost = G.settings.ghost ? P.Save.ghost(def.id) : null;
    G.paused = false;
    if (G.ui && G.ui.cur) G.ui.close(true);
    if (!def.run && P.Run.cur) P.Run.cancel();
    G.audio && G.audio.quiet && G.audio.quiet();
    if ((qs.has('autoplay') || qs.get('test') === 'campaign' || qs.get('test') === 'exposure') && !opts.auto) opts.auto = P.archivist(def.id) || { seed: 7 };
    G.scene = P.Play(G, def, Object.assign({
      ghost,
      // submit the instant the plate is finished (a quick R must never lose a best)
      onSubmit: opts.onFinish ? null : (res) => { res.prevRoute = P.routeFromGhost(def); res.prevSplits = ((P.Save.rec(def.id) || {}).splits) || null; res.sub = P.Save.submit(def, res); },
      onFinish: (res) => {
        const sub = res.sub;
        if (!G.ui) return;
        if (def.finale != null) G.ui.transmission(P.STORY.END, () => G.ui.results(def, res, sub), { paper: true });
        else G.ui.results(def, res, sub);
      },
    }, opts));
    G.hud.reset(G.scene);
    G.hud.show(true);
    document.body.classList.add('flying');
    G.audio && G.audio.enterPlate && G.audio.enterPlate(def);
  };

  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('600 20px "Sora"'), document.fonts.load('400 20px "Sora"'),
      document.fonts.load('400 20px "DM Mono"'), document.fonts.load('500 20px "DM Mono"'),
    ]).catch(() => {}).then(boot);
  } else boot();
})();
