<body>
<canvas id="gl"></canvas>
<canvas id="ink"></canvas>
<div id="hud"></div>
<div id="ui"></div>
<div id="shutter"><i></i><i></i></div>
<div id="nogl">This device can't run WebGL2. Try a recent Chrome, Edge, Firefox or Safari.</div>
<script>
// ---- src/core/util.js
'use strict';
// Shared math, easing and RNG. Everything lives on the global P namespace (plain scripts,
// concatenated by build.py — order in index.html matters).
const P = (window.P = window.P || {});

P.TAU = Math.PI * 2;
P.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
P.lerp = (a, b, t) => a + (b - a) * t;
P.invLerp = (a, b, x) => P.clamp((x - a) / (b - a), 0, 1);
P.smooth = (t) => t * t * (3 - 2 * t);
P.easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
P.easeInCubic = (t) => t * t * t;
P.easeOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
P.easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
P.easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
// framerate-independent exponential approach: k = fraction remaining after 1 s
P.damp = (a, b, k, dt) => b + (a - b) * Math.pow(k, dt);
P.wrapAngle = (a) => { while (a > Math.PI) a -= P.TAU; while (a < -Math.PI) a += P.TAU; return a; };
P.hypot = Math.hypot;

// Mulberry32 — deterministic, seedable
P.rng = (seed) => {
  let s = seed >>> 0;
  const f = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (a, b) => a + (b - a) * f();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * f());
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.sign = () => (f() < 0.5 ? -1 : 1);
  return f;
};
P.hashStr = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

// Colours are linear-ish HDR floats [r,g,b]; hex helper for authoring
P.hex = (h, mul = 1) => {
  const n = parseInt(h.replace('#', ''), 16);
  return [((n >> 16) & 255) / 255 * mul, ((n >> 8) & 255) / 255 * mul, (n & 255) / 255 * mul];
};
P.COL = {
  bone: P.hex('#ECE5D6'),
  boneDim: P.hex('#8F8A80'),
  signal: P.hex('#FF5A1F'),
  gold: P.hex('#F2C46D'),
  danger: P.hex('#FF3B30'),
  ice: P.hex('#9CC9E8'),
  void: P.hex('#05060A'),
};

// Blackbody approximation (Kelvin → rgb 0..1), used for stars and accretion disks
P.blackbody = (k) => {
  const t = k / 100;
  let r, g, b;
  if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
  else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
  return [P.clamp(r, 0, 255) / 255, P.clamp(g, 0, 255) / 255, P.clamp(b, 0, 255) / 255];
};

P.fmtTime = (s, places = 2) => {
  if (s == null || !isFinite(s)) return '—';
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  const str = sec.toFixed(places).padStart(places ? 3 + places : 2, '0');
  return (m > 0 ? m + ':' : '0:') + str;
};

P.now = () => performance.now() / 1000;

// gravity-map line colour per field (the contour shader and the level drawings share it)
P.CONTOUR = { I: '#4C8FD6', II: '#3FB5A8', III: '#8C74E6', IV: '#3BBBD0', V: '#6F9CFF', VI: '#F28DB2', VII: '#5E86E8', VIII: '#C9CCD6', title: '#4C8FD6' };

// how much of a ring a hole needs, in words
P.fracWord = (f) => (f < 0.4 ? 'a third' : f < 0.6 ? 'half' : f < 0.8 ? 'three quarters' : 'nearly all');
// ---- src/core/input.js
'use strict';
// Keyboard + mouse. Tracks held state, per-frame edges, and which device the player is
// actually using (so prompts and the kick direction follow their hands).
P.Input = (() => {
  const I = {
    keys: new Set(), pressed: new Set(), released: new Set(),
    mx: 0, my: 0, mdown: [false, false, false], mpress: [false, false, false],
    device: 'mouse', moved: false, wheel: 0, any: false,
  };
  const norm = (e) => e.code || e.key;
  addEventListener('keydown', (e) => {
    const k = norm(e);
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(k)) e.preventDefault();
    if (e.repeat) return;
    I.keys.add(k); I.pressed.add(k); I.any = true;
    if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyE'].includes(k)) I.device = 'keys';
  });
  addEventListener('keyup', (e) => { const k = norm(e); I.keys.delete(k); I.released.add(k); });
  addEventListener('blur', () => { I.keys.clear(); I.mdown = [false, false, false]; });
  addEventListener('mousemove', (e) => {
    const dx = e.clientX - I.mx, dy = e.clientY - I.my;
    I.mx = e.clientX; I.my = e.clientY;
    if (dx * dx + dy * dy > 9) { I.moved = true; I.device = 'mouse'; I.mouseSeen = true; }
  });
  addEventListener('mousedown', (e) => {
    if (e.button > 2) return;
    I.mdown[e.button] = true; I.mpress[e.button] = true; I.any = true; I.device = 'mouse';
  });
  addEventListener('mouseup', (e) => { if (e.button <= 2) I.mdown[e.button] = false; });
  addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('wheel', (e) => { I.wheel += e.deltaY; }, { passive: true });

  // ---- gamepad (standard mapping). Stick = burn direction; buttons map onto keys/edges.
  I.pad = { active: false, x: 0, y: 0, burn: false, kick: false, focus: false, probe: false };
  let prevBtn = [];
  const synth = (code, down) => dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code, key: code, bubbles: true }));
  const BTN = { 0: 'Enter', 1: 'Escape', 3: 'KeyR', 9: 'Escape', 12: 'ArrowUp', 13: 'ArrowDown', 14: 'ArrowLeft', 15: 'ArrowRight' };
  I.pollPad = (inMenu) => {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    const g = [...gps].find((x) => x && x.connected);
    if (!g) { I.pad.active = false; return; }
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    const mag = Math.hypot(ax, ay);
    const b = g.buttons.map((x) => x.pressed || x.value > 0.4);
    const any = mag > 0.3 || b.some(Boolean);
    if (any) { I.pad.active = true; I.device = 'pad'; I.any = true; }
    I.pad.x = ax; I.pad.y = ay;
    I.pad.burn = mag > 0.3 || !!b[7];
    I.pad.kick = (b[0] && !prevBtn[0] && !inMenu) || (b[5] && !prevBtn[5]);
    I.pad.focus = !!(b[4] || b[6]);
    I.pad.probe = !!(b[2] && !prevBtn[2] && !inMenu);
    for (const k in BTN) {
      const i = +k;
      if (i === 0 && !inMenu) continue;          // A kicks in flight
      if (b[i] && !prevBtn[i]) synth(BTN[i], true);
      if (!b[i] && prevBtn[i]) synth(BTN[i], false);
    }
    // stick as menu arrows
    if (inMenu) {
      const dir = mag > 0.6 ? (Math.abs(ax) > Math.abs(ay) ? (ax > 0 ? 'ArrowRight' : 'ArrowLeft') : (ay > 0 ? 'ArrowDown' : 'ArrowUp')) : null;
      if (dir !== I._stickDir) { if (dir) synth(dir, true); if (I._stickDir) synth(I._stickDir, false); I._stickDir = dir; }
    }
    prevBtn = b;
  };
  I.down = (...ks) => ks.some((k) => I.keys.has(k));
  I.hit = (...ks) => ks.some((k) => I.pressed.has(k));
  I.endFrame = () => {
    I.pressed.clear(); I.released.clear();
    I.mpress = [false, false, false]; I.moved = false; I.wheel = 0; I.any = false;
  };
  return I;
})();
// ---- src/core/save.js
'use strict';
// Persistence: per-plate records (best time, medal, best-run inputs for the ghost),
// settings, and story flags. One localStorage key, versioned.
P.Save = (() => {
  const KEY = 'periapsis.v1';
  let data = { plates: {}, settings: {}, flags: {}, deep: { best: 0, runs: 0 } };
  try { const raw = localStorage.getItem(KEY); if (raw) data = Object.assign(data, JSON.parse(raw)); } catch (e) { /* private mode */ }
  const S = { data };
  S.write = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* ignore */ } };
  S.rec = (id) => data.plates[id] || null;

  // inputs: Uint16Array → RLE base64 (runs of identical ticks are common)
  S.pack = (arr) => {
    const out = [];
    for (let i = 0; i < arr.length;) {
      let j = i; while (j < arr.length && arr[j] === arr[i] && j - i < 65535) j++;
      out.push(arr[i], j - i); i = j;
    }
    const u = new Uint16Array(out);
    let s = ''; const b = new Uint8Array(u.buffer);
    for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  };
  S.unpack = (str) => {
    if (!str) return null;
    const bin = atob(str); const b = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    const u = new Uint16Array(b.buffer);
    let n = 0; for (let i = 1; i < u.length; i += 2) n += u[i];
    const out = new Uint16Array(n); let k = 0;
    for (let i = 0; i < u.length; i += 2) { out.fill(u[i], k, k + u[i + 1]); k += u[i + 1]; }
    return out;
  };

  S.medalFor = (def, t) => {
    const m = def.medals; if (!m) return 1;
    return t <= m[2] ? 4 : t <= m[1] ? 3 : t <= m[0] ? 2 : 1;   // 1 bronze · 2 silver · 3 gold · 4 ace
  };
  // returns {improved, medal, prevBest, prevMedal}
  S.submit = (def, result) => {
    const id = def.id;
    const r = data.plates[id] || { best: null, medal: 0, runs: 0 };
    const prevBest = r.best, prevMedal = r.medal;
    const medal = S.medalFor(def, result.time);
    r.runs = (r.runs || 0) + 1;
    const improved = r.best == null || result.time < r.best - 1e-9;
    if (improved) { r.best = result.time; r.ghost = S.pack(result.inputs); if (result.splits) r.splits = result.splits.map((x) => +x.toFixed(3)); }
    r.medal = Math.max(r.medal || 0, medal);
    data.plates[id] = r;
    S.write();
    return { improved, medal, prevBest, prevMedal, best: r.best };
  };
  S.ghost = (id) => { const r = data.plates[id]; return r && r.ghost ? S.unpack(r.ghost) : null; };
  S.settings = () => data.settings;
  S.flag = (k, v) => { if (v === undefined) return data.flags[k]; data.flags[k] = v; S.write(); };
  S.reset = () => { data = { plates: {}, settings: data.settings, flags: {}, deep: { best: 0, runs: 0 } }; S.data = data; S.write(); };
  return S;
})();
// ---- src/gfx/gl.js
'use strict';
// Thin WebGL2 helpers: programs, HDR render targets, the fullscreen triangle.
P.GL = {};

P.GL.create = (canvas) => {
  const gl = canvas.getContext('webgl2', {
    antialias: false, alpha: false, depth: false, stencil: false,
    premultipliedAlpha: false, preserveDrawingBuffer: !!P.TESTMODE, powerPreference: 'high-performance',
  });
  if (!gl) return null;
  const cbf = gl.getExtension('EXT_color_buffer_float');
  gl.getExtension('EXT_color_buffer_half_float');
  gl.getExtension('OES_texture_float_linear');
  P.GL.hdr = !!cbf;
  return gl;
};

P.GL.program = (gl, vsSrc, fsSrc, name) => {
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(s);
      const lines = src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n');
      console.error('Shader compile failed [' + name + ']\n' + log + '\n' + lines);
      throw new Error('shader ' + name);
    }
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error('Link failed [' + name + ']', gl.getProgramInfoLog(p));
    throw new Error('link ' + name);
  }
  // cache uniform locations lazily
  const locs = {};
  p.u = (n) => (n in locs ? locs[n] : (locs[n] = gl.getUniformLocation(p, n)));
  return p;
};

// A colour render target. HDR (RGBA16F) when supported.
P.GL.target = (gl, w, h, opts = {}) => {
  const t = { w, h, tex: gl.createTexture(), fbo: gl.createFramebuffer() };
  const hdr = P.GL.hdr && opts.hdr !== false;
  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, hdr ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  t.free = () => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); };
  return t;
};

P.GL.FS_VERT = `#version 300 es
precision highp float;
const vec2 V[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
out vec2 v_uv;
void main(){ vec2 p = V[gl_VertexID]; v_uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
// ---- src/gfx/shaders.js
'use strict';
// GLSL sources. World is y-DOWN (screen-like); GL framebuffers are y-up — conversions are
// done in the vertex/fragment stages, never in game code.
P.SH = {};

const NOISE_GLSL = `
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 h32(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz+33.33); return fract((p3.xxy+p3.yzz)*p3.zyx); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(h12(i), h12(i+vec2(1,0)), u.x), mix(h12(i+vec2(0,1)), h12(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float a = .5, s = 0.; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for(int i=0;i<5;i++){ s += a*vnoise(p); p = m*p; a *= .5; } return s; }
vec3 blackbody(float k){ // 1000..15000 K -> rgb
  float t = k/100.; vec3 c;
  c.r = t <= 66. ? 1. : clamp(1.2929 * pow(t-60., -0.1332), 0., 1.);
  c.g = t <= 66. ? clamp(0.3901*log(t) - 0.6318, 0., 1.) : clamp(1.1298*pow(t-60., -0.0755), 0., 1.);
  c.b = t >= 66. ? 1. : (t <= 19. ? 0. : clamp(0.5432*log(t-10.) - 1.1963, 0., 1.));
  return c; }
`;

// ---------------------------------------------------------------- background (deep field)
P.SH.bgFrag = `#version 300 es
precision highp float;
uniform vec2 u_res; uniform vec2 u_cam; uniform float u_zoom; uniform float u_time;
uniform vec3 u_tintA; uniform vec3 u_tintB; uniform float u_seed; uniform float u_neb; uniform float u_reseau; uniform float u_stars;
uniform vec4 u_core; // distant core: gl px x, y, shadow radius px, intensity
out vec4 o;
${NOISE_GLSL}
vec3 starLayer(vec2 px, float cell, float dens, float bright, float seed){
  vec2 g = px / cell; vec2 id = floor(g); vec2 f = fract(g);
  vec3 h = h32(id + seed);
  if (h.z > dens) return vec3(0.);
  vec2 sp = .15 + .7*h.xy;
  float d = length((f - sp) * cell);
  float m = pow(fract(h.z*91.7 + h.x*13.1), 9.0); // magnitude: mostly dim, a few bright
  float I = bright * (0.08 + 0.9*m);
  float rad = .55 + 1.1*m;
  float k = 1000. + 11000.*pow(fract(h.y*57.3), 1.6);
  vec3 col = mix(vec3(1.), blackbody(k), .25);   // near-neutral: warm stars read as chips/debris
  float tw = .85 + .15*sin(u_time*(1.5+3.*h.x) + h.y*40.);
  float core = exp(-d*d/(rad*rad));
  // faint diffraction cross on the brightest
  float spikes = m > 2. ? (exp(-abs((f.x-sp.x)*cell)*1.6)*exp(-abs((f.y-sp.y)*cell)*.06) + exp(-abs((f.y-sp.y)*cell)*1.6)*exp(-abs((f.x-sp.x)*cell)*.06)) * .18 * m : 0.;
  return col * I * tw * (core + spikes);
}
void main(){
  vec2 fc0 = gl_FragCoord.xy;
  vec2 fc = fc0;
  // the distant core: a supermassive hole far behind the plate, bending the deep field
  float coreShadow = 1.; vec3 coreLight = vec3(0.);
  if (u_core.w > 0.) {
    vec2 d = fc0 - u_core.xy; float r = length(d) + 1e-3; float rs = u_core.z;
    float E = rs * 1.75;
    fc = fc0 - d * (E * E / (r * r)) * smoothstep(rs * .9, rs * 1.1, r);
    float big = smoothstep(70., 320., rs);                  // vast cores get atmospheric, small ones stay crisp
    coreShadow = mix(mix(.5, .22, big), 1., smoothstep(rs * mix(.97, .9, big), rs * mix(1.04, 1.12, big), r));
    float pr = (r - rs * 1.05) / (rs * mix(.03, .07, big) + 1.2);
    coreLight += vec3(1., .8, .62) * (exp(-pr * pr * .08) * .05);   // only a faint, wide glow — no crisp ring
    coreLight += u_tintA * 0.9 * (1. - coreShadow) * .3 * big;   // a little haze in the shadow: it's far away
    // faint face-on disk, slowly turning
    float x = r / rs;
    if (x > 1.25 && x < 3.4) {
      float ang = atan(d.y, d.x) - u_time * .015 / pow(x, 1.5);
      float n = fbm(vec2(cos(ang), sin(ang)) * 3. + x * 2.5);
      float prof = smoothstep(1.25, 1.5, x) * pow(1. - (x - 1.25) / 2.15, 2.2);
      coreLight += mix(vec3(1., .55, .3), vec3(1., .85, .7), 1. - (x - 1.25) / 2.15) * prof * smoothstep(.3, .8, n) * .16;
    }
    coreLight *= u_core.w; coreShadow = mix(1., coreShadow, u_core.w);
  }
  vec2 sc = vec2(fc.x - u_res.x*.5, u_res.y*.5 - fc.y);          // screen px, y-down, centred
  vec2 w = u_cam + sc / u_zoom;                                     // world position
  float zs = pow(u_zoom, .35);
  vec3 c = vec3(0.004, 0.006, 0.012);
  // nebula: two-tone, very low frequency, parallax 0.25
  vec2 nq = (u_cam*.25 + sc/(u_zoom*1.6)) * .0011 + u_seed;
  float n1 = fbm(nq), n2 = fbm(nq*2.1 + 7.3), dust = fbm(nq*3.4 - 4.1);
  float neb = smoothstep(.35, .95, n1);
  vec3 nc = mix(u_tintA, u_tintB, smoothstep(.3, .8, n2));
  c += nc * neb * neb * u_neb * (0.55 + 0.45*dust);
  c *= mix(1., .55, smoothstep(.45, .8, dust) * u_neb);
  // star layers — pixel-space with depth parallax
  // in flight the stars fade right back (u_stars): nothing that means nothing should drift across the board
  vec3 st = starLayer(fc + vec2(u_cam.x, -u_cam.y)*u_zoom*.02, 9.0*zs + 7., .30, .26, u_seed + 1.);
  st += starLayer(fc + vec2(u_cam.x, -u_cam.y)*u_zoom*.04, 23.*zs + 10., .35, .42, u_seed + 2.);
  st += starLayer(fc + vec2(u_cam.x, -u_cam.y)*u_zoom*.07, 61.*zs + 20., .45, .6, u_seed + 3.);
  st += starLayer(fc + vec2(u_cam.x, -u_cam.y)*u_zoom*.1, 170.*zs + 40., .6, .8, u_seed + 4.);
  c += st * u_stars;
  // réseau: the plate's registration crosses, in world space (so lensing bends them)
  if (u_reseau > 0.) {
    float S = 320.;
    vec2 g = (w + S*.5) / S; vec2 f = (fract(g) - .5) * S;            // world units from cross centre
    float px = 1./u_zoom;
    float arm = 9.;
    float lx = (1. - smoothstep(.45*px, 1.4*px, abs(f.y))) * step(abs(f.x), arm);
    float ly = (1. - smoothstep(.45*px, 1.4*px, abs(f.x))) * step(abs(f.y), arm);
    c += vec3(.93, .9, .84) * max(lx, ly) * .085 * u_reseau;
  }
  c = c * coreShadow + coreLight;
  o = vec4(c, 1.);
}`;

// ---------------------------------------------------------------- instanced sprites (SDF kinds)
P.SH.spriteVert = `#version 300 es
precision highp float;
layout(location=0) in vec2 a_corner;
layout(location=1) in vec4 a_posSize;   // x y sx sy (world, half-size)
layout(location=2) in vec2 a_rotKind;
layout(location=3) in vec4 a_col;
layout(location=4) in vec4 a_p;
layout(location=5) in vec4 a_q;
uniform vec4 u_view;  // camX camY zoom(px/unit) unused
uniform vec2 u_res;
out vec2 v_uv; out vec4 v_col; out vec4 v_p; out vec4 v_q; out float v_kind; out vec2 v_px;
void main(){
  float c = cos(a_rotKind.x), s = sin(a_rotKind.x);
  vec2 l = a_corner * a_posSize.zw;
  vec2 wp = a_posSize.xy + vec2(c*l.x - s*l.y, s*l.x + c*l.y);
  vec2 sp = (wp - u_view.xy) * u_view.z;          // px from centre, y-down
  gl_Position = vec4(sp.x / (u_res.x*.5), -sp.y / (u_res.y*.5), 0., 1.);
  v_uv = a_corner; v_col = a_col; v_p = a_p; v_q = a_q; v_kind = a_rotKind.y;
  v_px = a_posSize.zw * u_view.z;                  // half-size in px
}`;

P.SH.spriteFrag = `#version 300 es
precision highp float;
in vec2 v_uv; in vec4 v_col; in vec4 v_p; in vec4 v_q; in float v_kind; in vec2 v_px;
uniform float u_time;
out vec4 o;
${NOISE_GLSL}
float sdPoly4(vec2 p, vec2 a, vec2 b, vec2 c, vec2 d){
  vec2 v[4] = vec2[4](a,b,c,d);
  float dd = dot(p-v[0],p-v[0]); float s = 1.;
  for(int i=0,j=3;i<4;j=i,i++){
    vec2 e = v[j]-v[i]; vec2 w = p-v[i];
    vec2 b2 = w - e*clamp(dot(w,e)/dot(e,e),0.,1.);
    dd = min(dd, dot(b2,b2));
    bvec3 cond = bvec3(p.y>=v[i].y, p.y<v[j].y, e.x*w.y>e.y*w.x);
    if(all(cond) || all(not(cond))) s*=-1.;
  }
  return s*sqrt(dd);
}
float bit(float m, float i){ return mod(floor(m / exp2(i)), 2.); }
void main(){
  int k = int(v_kind + .5);
  vec2 uv = v_uv; float r = length(uv);
  float px = 1. / v_px.x;        // one pixel in uv units
  float a = 0.; vec3 col = v_col.rgb;
  if (k == 0) {                  // glow: gaussian, p.x = tightness
    float t = v_p.x > 0. ? v_p.x : 4.;
    a = exp(-r*r*t) * (1. - smoothstep(.85, 1., r));
  } else if (k == 1) {           // disc
    a = 1. - smoothstep(1. - 1.5*px, 1., r);
  } else if (k == 2) {           // ring: p.x thickness px
    float t = v_p.x * px; float d = abs(r - (1. - t*.5 - px));
    a = 1. - smoothstep(t*.5 - px*.5, t*.5 + px*.5, d);
  } else if (k == 3) {           // segmented survey ring
    float t = v_p.x * px; float d = abs(r - (1. - t*.5 - px));
    a = 1. - smoothstep(t*.5 - px*.5, t*.5 + px*.5, d);
    float N = v_p.y;
    float ang = atan(uv.y, uv.x); if (ang < 0.) ang += 6.2831853;
    float fs = ang / 6.2831853 * N; float seg = floor(fs); float ff = fract(fs);
    float bpx = min(ff, 1. - ff) * 6.2831853 / N * r * v_px.x;     // px to segment boundary
    a *= smoothstep(v_q.x*.5 - .5, v_q.x*.5 + .5, bpx);
    float lit = seg < 24. ? bit(v_p.z, seg) : bit(v_p.w, seg - 24.);
    // unlit arcs are a dim grey, lit ones full gold: progress reads at a glance
    col = mix(vec3(dot(col, vec3(.3, .5, .2))) * v_q.y * .85, col * v_q.z, lit);
    a *= mix(v_q.w * .9, 1., lit);
  } else if (k == 4) {           // probe hull (points +x)
    vec2 q = uv;
    float d = sdPoly4(q, vec2(1.,0.), vec2(-.62,.5), vec2(-.32,0.), vec2(-.62,-.5));
    a = 1. - smoothstep(-px, px, d);
    float rim = 1. - smoothstep(0., px*2.5, abs(d + px*2.));
    col = mix(col, col*1.6, rim*.6);
  } else if (k == 5) {           // diamond outline (p.x thickness px; p.y>0 = filled)
    float d = abs(uv.x) + abs(uv.y);
    if (v_p.y > 0.) a = 1. - smoothstep(1. - 2.*px, 1., d);
    else { float t = v_p.x*px; a = 1. - smoothstep(t*.5, t*.5 + px*1.2, abs(d - 1. + t)); }
  } else if (k == 6) {           // shockwave: soft ring, p.x = width (0..1)
    float w = max(v_p.x, .02);
    a = exp(-pow((r - (1. - w)) / w, 2.)) * (1. - smoothstep(.96, 1., r));
  } else if (k == 7) {           // accretion disk — p: rIn/rOut, spin, temperature K, beaming; q.x = seed
    float rin = v_p.x;
    if (r > 1. || r < rin*.9) discard;
    float x = (r - rin) / (1. - rin);                            // 0 inner .. 1 outer
    float ang = atan(uv.y, uv.x);
    float om = v_p.y / pow(max(r, .05), 1.5);                    // keplerian angular velocity
    // flow-mapped differential rotation: two phases cross-faded so shear never winds up
    float P_ = 3.2;
    float t1 = fract(u_time / P_), t2 = fract(u_time / P_ + .5);
    float w1 = 1. - abs(1. - 2.*t1);
    float a1 = om * (t1 - .5) * P_, a2 = om * (t2 - .5) * P_;
    mat2 m1 = mat2(cos(a1), sin(a1), -sin(a1), cos(a1));
    mat2 m2 = mat2(cos(a2), sin(a2), -sin(a2), cos(a2));
    vec2 q1 = m1 * uv, q2 = m2 * uv;
    float n1 = fbm(q1 * 5.5 + v_q.x) * .6 + fbm(q1 * 17. + v_q.x * 2.) * .4;
    float n2 = fbm(q2 * 5.5 + v_q.x + 3.1) * .6 + fbm(q2 * 17. + v_q.x * 2. + 1.7) * .4;
    float n = mix(n2, n1, w1);
    float streak = .12 + 1.5*smoothstep(.32, .78, n);
    float prof = pow(1. - x, 2.2) * smoothstep(0., .05, x);
    float T = v_p.z * pow(max(r/rin, 1.), -.85);
    vec3 bb = blackbody(T);
    float beam = 1. + v_p.w * sin(ang);                          // doppler asymmetry for spinning holes
    col = bb * v_col.rgb;
    a = prof * streak * beam * (1. - smoothstep(.9, 1., r));
    a *= smoothstep(rin*.9, rin*1.02, r);
  } else if (k == 8) {           // star / pulsar core with diffraction spikes; p.x spikes count, p.y rotation
    float core = exp(-r*r*60.) + exp(-r*r*9.)*.35;
    float an = atan(uv.y, uv.x) + v_p.y;
    float sp = pow(abs(cos(an * v_p.x * .5)), 220.) * exp(-r*3.2);
    a = clamp(core + sp*.9, 0., 1.5) * (1. - smoothstep(.9, 1., r));
  } else if (k == 9) {           // chevron (points +x)
    float d = sdPoly4(uv, vec2(1.,0.), vec2(-.7,.75), vec2(-.25,0.), vec2(-.7,-.75));
    a = 1. - smoothstep(-px, px, d);
  } else if (k == 10) {          // dashed ring: p.x thickness px, p.y dash count, p.z phase, p.w duty
    float t = v_p.x * px; float d = abs(r - (1. - t*.5 - px));
    a = 1. - smoothstep(t*.5 - px*.5, t*.5 + px*.5, d);
    float ang = atan(uv.y, uv.x) / 6.2831853 + v_p.z;
    float f = fract(ang * v_p.y);
    float duty = v_p.w > 0. ? v_p.w : .5;
    float e = .5 / (6.2831853 * r * v_px.x / v_p.y);              // half px in dash units
    a *= smoothstep(-e, e, f) * (1. - smoothstep(duty - e, duty + e, f));
  } else if (k == 11) {          // soft disc (vignette-like), p.x = inner (0..1)
    a = 1. - smoothstep(v_p.x, 1., r);
  } else if (k == 12) {          // tick marks around a circle: p.x count, p.y length frac, p.z thickness px, p.w phase
    float ang = atan(uv.y, uv.x) / 6.2831853 + v_p.w;
    float f = fract(ang * v_p.x); f = min(f, 1. - f);
    float dpx = f * 6.2831853 * r * v_px.x / v_p.x;
    a = (1. - smoothstep(v_p.z*.5 - .5, v_p.z*.5 + .5, dpx)) * step(1. - v_p.y, r) * (1. - smoothstep(1. - px, 1., r));
  } else if (k == 13) {          // aperture iris: p.x open (0..1), p.y blades, p.z rotation
    float ang = atan(uv.y, uv.x) + v_p.z;
    float bl = v_p.y;
    float seg = fract(ang / 6.2831853 * bl);
    float open = v_p.x;
    float edge = mix(.08, .86, open) + seg * .16 * (1. - open*.6);
    float ring = 1. - smoothstep(1. - 1.5*px, 1., r);
    float blade = smoothstep(edge - px, edge + px, r);
    float seam = smoothstep(0., .02, seg) * smoothstep(0., .02, 1. - seg);
    a = ring * blade * mix(.55, 1., seam);
    col = v_col.rgb * (.55 + .45 * (r - edge) / max(1. - edge, .01));
  } else if (k == 14) {          // radial gradient heat haze: hot inner fading outward (for beams/jets)
    a = pow(max(1. - r, 0.), v_p.x > 0. ? v_p.x : 2.);
  } else if (k == 16) {          // rock shard: noisy polygon, lit rim. p.x seed
    float ang = atan(uv.y, uv.x);
    float edge = .78 + .22 * (vnoise(vec2(ang * 1.6 + v_p.x, v_p.x)) - .5) * 2. * .9;
    edge = min(edge, .98);
    float d = r - edge;
    a = 1. - smoothstep(-px, px, d);
    float rim = smoothstep(-px * 3.5, 0., d) * (.6 + .4 * dot(normalize(uv + 1e-4), vec2(-.6, -.8)));
    col = mix(v_col.rgb * .35, v_col.rgb * 1.4, clamp(rim, 0., 1.));
  } else if (k == 15) {          // beam: long soft-edged bar along x, p.x core width (0..1), p.y>0: bright at origin (-x)
    float w = max(v_p.x, .05);
    float along = uv.x * .5 + .5;
    a = exp(-pow(uv.y / (w * (1. + along * .8)), 2.));
    a *= v_p.y > 0. ? pow(1. - along, .9) * smoothstep(0., .04, along) : smoothstep(1., .55, abs(uv.x));
  }
  a *= v_col.a;
  if (a <= 0.002) discard;
  o = vec4(col * a, a);
}`;

// ---------------------------------------------------------------- polylines (AA strips)
P.SH.lineVert = `#version 300 es
precision highp float;
layout(location=0) in vec2 a_pos;      // world, already expanded by CPU
layout(location=1) in vec4 a_line;     // across(-1..1), halfWidthPx, along(world), dashPeriod(world)
layout(location=2) in vec4 a_col;
layout(location=3) in float a_duty;
uniform vec4 u_view; uniform vec2 u_res;
out vec4 v_line; out vec4 v_col; out float v_duty;
void main(){
  vec2 sp = (a_pos - u_view.xy) * u_view.z;
  gl_Position = vec4(sp.x / (u_res.x*.5), -sp.y / (u_res.y*.5), 0., 1.);
  v_line = a_line; v_col = a_col; v_duty = a_duty;
}`;
P.SH.lineFrag = `#version 300 es
precision highp float;
in vec4 v_line; in vec4 v_col; in float v_duty;
uniform vec4 u_view;
out vec4 o;
void main(){
  float hw = v_line.y;                         // half width px (core)
  float d = abs(v_line.x) * (hw + 1.);         // px from centre line
  float a = clamp(hw + .5 - d, 0., 1.);
  if (hw < .5) a *= hw * 2.;                    // sub-pixel lines fade rather than alias
  if (v_line.w > 0.) {
    float f = fract(v_line.z / v_line.w);
    float e = .6 / (v_line.w * u_view.z);
    a *= smoothstep(0., e, f) * (1. - smoothstep(v_duty - e, v_duty, f));
  }
  a *= v_col.a;
  if (a <= 0.002) discard;
  o = vec4(v_col.rgb * a, a);
}`;

// ---------------------------------------------------------------- gravitational lensing
// ---------------------------------------------------------------- the gravity map (contours)
// Topographic lines of the gravitational potential — a height map of the well. Where lines crowd
// together the ground is steep: the pull is strong. Each line glows by the actual pull there.
// Drawn into the lensed world layer, so the lines wrap round the horizons.
P.SH.fieldFrag = `#version 300 es
precision highp float;
uniform vec2 u_res; uniform vec2 u_cam; uniform float u_zoom; uniform float u_time;
uniform int u_n; uniform vec4 u_b[24];      // x, y (world), mass, sign (1 hole, −k white hole)
uniform vec4 u_b2[24];                       // horizon radius, charted (0/1), highlight, spare
uniform float u_fall; uniform float u_R0; uniform float u_step; uniform float u_str;
uniform vec3 u_cold; uniform vec3 u_warm; uniform vec3 u_hot; uniform vec3 u_gold;
out vec4 o;
void main(){
  vec2 sc = vec2(gl_FragCoord.x - u_res.x*.5, u_res.y*.5 - gl_FragCoord.y);
  vec2 w = u_cam + sc / u_zoom;
  float h = 0.; vec2 g = vec2(0.); float near = 1e9; float lit = 0.; float best = 0.; float done = 0.; float own = 0.;
  for (int i = 0; i < 24; i++) {
    if (i >= u_n) break;
    vec4 b = u_b[i];
    vec2 d = b.xy - w; float r = max(length(d), 4.);
    float q = u_R0 / r;
    float hi = b.w * b.z * pow(q, u_fall - 1.);       // this body's share of the depth
    h += hi;                                           // depth of the well (∝ −Φ)
    if (hi > best) { best = hi; done = u_b2[i].y; }   // whose ground is this? (mapped → gold)
    g += b.w * b.z * pow(q, u_fall) * d / r;           // pull, in units of a mass-1 hole at R0
    float rr = r / max(u_b2[i].x, 1.);
    near = min(near, rr);
    lit = max(lit, u_b2[i].z * exp(-rr * .08));
  }
  float gm = length(g);
  // contour lines: evenly spaced in depth, so they crowd where the ground is steep
  float x = h / u_step;
  float fw = max(fwidth(x), 1e-4);
  float dist = abs(fract(x + .5) - .5) / fw;             // px to the nearest line
  float major = step(abs(mod(floor(x + .5), 5.)), .5);
  float line = 1. - smoothstep(mix(.3, .45, major), mix(1.2, 1.5, major), dist);
  float dense = smoothstep(.1, .5, fw);                  // lines closer than a few px merge into a glow
  // a slow pulse running downhill, line to line: the field is alive
  float flow = .72;   // still: motion on the board should mean something
  float s = clamp(pow(gm / 2.5, .4), 0., 1.);             // pull strength: climbs across the whole board
  own = best / max(h, 1e-4);                             // how clearly one body owns this ground
  vec3 base = mix(u_cold, u_gold, done * smoothstep(.45, .8, own));
  vec3 col = mix(base, u_warm, smoothstep(.35, .7, s) * .55);
  col = mix(col, u_hot, smoothstep(.62, 1., s));
  float a = line * mix(.5, .85, major) * flow * (1. - dense);
  a += dense * .12 * smoothstep(1.2, 3., near);           // the merged glow, held back from the horizon
  a *= mix(smoothstep(1.7, 3.4, near), smoothstep(3.4, 8., near), 1. - dense * .6);   // close in, the rings clear away: the horizon reads alone
  a *= .35 + 1.05 * s + .3 * lit;
  // relief bands: every other step a breath darker, so basins read as basins
  float band = mod(floor(x), 2.) * (1. - dense);
  vec3 wash = base * (.018 * band + .05 * smoothstep(.0, 2.5, h)) * smoothstep(1.05, 2.5, near);
  o = vec4(col * a * u_str + wash * u_str, 1.);
}`;

P.SH.lensFrag = `#version 300 es
precision highp float;
uniform sampler2D u_tex; uniform vec2 u_res; uniform int u_n;
uniform vec4 u_h[16];   // x y (gl px), shadow r px, einstein r px
uniform vec4 u_hc[16];  // photon-ring colour rgb, ring intensity
uniform float u_ca;
in vec2 v_uv;
out vec4 o;
void main(){
  vec2 p = gl_FragCoord.xy;
  vec2 off = vec2(0.); float vis = 1.; vec3 ring = vec3(0.);
  for (int i = 0; i < 16; i++) {
    if (i >= u_n) break;
    vec4 h = u_h[i];
    vec2 d = p - h.xy; float r2 = dot(d, d) + 1.; float r = sqrt(r2);
    off -= d * (h.w*h.w / r2);
    vis *= smoothstep(h.z*.985, h.z*1.03 + .8, r);
    float rr = (r - h.z*1.045) / (h.z*.028 + .9);
    ring += u_hc[i].rgb * u_hc[i].a * (exp(-rr*rr) + .25*exp(-rr*rr*.08));
  }
  vec2 q = (p + off) / u_res;
  vec2 cc = q - .5; float ca = u_ca * (0.4 + dot(cc, cc) * 2.2) * .012;
  vec3 c;
  c.r = texture(u_tex, clamp(q + cc * ca, vec2(.001), vec2(.999))).r;
  c.g = texture(u_tex, clamp(q, vec2(.001), vec2(.999))).g;
  c.b = texture(u_tex, clamp(q - cc * ca, vec2(.001), vec2(.999))).b;
  o = vec4(c * vis + ring * vis, 1.);
}`;

// ---------------------------------------------------------------- bloom (dual filter)
P.SH.downFrag = `#version 300 es
precision highp float;
uniform sampler2D u_tex; uniform vec2 u_texel; uniform float u_thresh;
in vec2 v_uv; out vec4 o;
void main(){
  vec2 t = u_texel;
  vec3 c = texture(u_tex, v_uv).rgb * 4.;
  c += texture(u_tex, v_uv + vec2(-t.x, -t.y)).rgb;
  c += texture(u_tex, v_uv + vec2( t.x, -t.y)).rgb;
  c += texture(u_tex, v_uv + vec2(-t.x,  t.y)).rgb;
  c += texture(u_tex, v_uv + vec2( t.x,  t.y)).rgb;
  c /= 8.;
  if (u_thresh > 0.) { float l = max(c.r, max(c.g, c.b)); c *= max(l - u_thresh, 0.) / max(l, 1e-4); }
  o = vec4(c, 1.);
}`;
P.SH.upFrag = `#version 300 es
precision highp float;
uniform sampler2D u_tex; uniform vec2 u_texel;
in vec2 v_uv; out vec4 o;
void main(){
  vec2 t = u_texel;
  vec3 c = texture(u_tex, v_uv + vec2(-2.*t.x, 0.)).rgb + texture(u_tex, v_uv + vec2(2.*t.x, 0.)).rgb
         + texture(u_tex, v_uv + vec2(0., -2.*t.y)).rgb + texture(u_tex, v_uv + vec2(0., 2.*t.y)).rgb;
  c += (texture(u_tex, v_uv + vec2(-t.x, -t.y)).rgb + texture(u_tex, v_uv + vec2(t.x, -t.y)).rgb
      + texture(u_tex, v_uv + vec2(-t.x, t.y)).rgb + texture(u_tex, v_uv + vec2(t.x, t.y)).rgb) * 2.;
  o = vec4(c / 12., 1.);
}`;

// ---------------------------------------------------------------- final composite
P.SH.compFrag = `#version 300 es
precision highp float;
uniform sampler2D u_scene; uniform sampler2D u_bloom; uniform vec2 u_res;
uniform float u_time; uniform float u_bloomStr; uniform float u_ca; uniform float u_grain; uniform float u_vig;
uniform float u_exposure; uniform vec4 u_flash; uniform float u_desat; uniform float u_fade;
uniform vec4 u_wave[4];  // x y (uv) radius(px) strength
in vec2 v_uv; out vec4 o;
${NOISE_GLSL}
vec3 soft(vec3 x){ // near-identity below .8, smooth shoulder above (hot colours whiten)
  vec3 s = .8 + .2 * (1. - exp(-(x - .8) / .2));
  return mix(x, s, step(.8, x));
}
void main(){
  vec2 uv = v_uv;
  vec2 ppx = uv * u_res;
  // shockwave distortion
  for (int i = 0; i < 4; i++) {
    vec4 w = u_wave[i];
    if (w.w <= 0.) continue;
    vec2 d = ppx - w.xy * u_res; float r = length(d);
    float x = (r - w.z) / (18. + w.z*.12);
    float k = exp(-x*x) * x * w.w;
    ppx -= d / max(r, 1.) * k * 14.;
  }
  uv = ppx / u_res;
  vec2 cc = uv - .5;
  float ca = u_ca * (0.4 + dot(cc, cc) * 2.2);
  vec3 c;
  c.r = texture(u_scene, uv + cc * ca * .012).r;
  c.g = texture(u_scene, uv).g;
  c.b = texture(u_scene, uv - cc * ca * .012).b;
  vec3 b = texture(u_bloom, uv).rgb;
  c += b * u_bloomStr;
  c *= u_exposure;
  c = soft(c);
  float l = dot(c, vec3(.299, .587, .114));
  c = mix(c, vec3(l), u_desat);
  // grade: cool the shadows a touch, warm the highlights
  c = mix(c * vec3(.92, .97, 1.08), c * vec3(1.04, 1., .95), smoothstep(.1, .7, l));

  else if (M.afterburner && s.burnT) s.burnT = 0;

  if (M.drain) s.fuel = Math.max(0, s.fuel - M.drain * dt);
  // the open exit draws you in (runs set gateTow): a gentle pull that grows as you close in
  if (W.gateTow && s.gateOpen) { const gx = W.gate.x - s.x, gy = W.gate.y - s.y, gd = Math.hypot(gx, gy) || 1; if (gd < W.gateTowR) { const k = W.gateTow * (1 - gd / W.gateTowR); ax += (gx / gd) * k; ay += (gy / gd) * k; } if (gd < Math.min(400, W.gateTowR)) { const nx = gx / gd, ny = gy / gd, vn = s.vx * nx + s.vy * ny, tx = s.vx - vn * nx, ty = s.vy - vn * ny, dmp = 3 * (1 - gd / Math.min(400, W.gateTowR)); ax -= tx * dmp; ay -= ty * dmp; } }   // …and close in, it damps the sideways swing so you spiral in, not round
  s.vx += ax * dt; s.vy += ay * dt;
  s.perfectWin = S.periWindow(W, s);
  if (s.perfectWin >= 0) { s.lastWin = s.perfectWin; s.coyote = W.mods.coyote || S.COYOTE; } else if (s.coyote > 0) s.coyote -= dt;
  const win = s.perfectWin >= 0 ? s.perfectWin : (s.coyote > 0 ? s.lastWin : -1);
  s.winNow = W.mods.coyote ? win : s.perfectWin;   // what the screen shows: in runs the glow holds as long as the fling does
  if (win < 0) s.dbl = false;
  if (s.kickCd > 0) s.kickCd -= dt;
  if (s.guard > 0) s.guard -= dt;
  if (inp.kick) s.kickBuf = S.KICK_BUF;
  if (s.kickBuf > 0) {
    const expiring = s.kickBuf <= dt * 1.01;
    if (s.kickCd <= 0 && (win >= 0 || expiring || !S.approaching(W, s))) {
      s.kickBuf = 0;
      if (win >= 0) {
        // the fling goes where you point it; within a few degrees of prograde/retrograde it snaps exact
        // Chain Fling (an upgrade): flings in quick succession stack up
        if (M.chainFling) { const on = s.t - (s.chainT == null ? -9 : s.chainT) < 2.5; s.chainN = on ? Math.min(3, (s.chainN || 0) + 1) : 0; s.chainT = s.t; s.chainMul = 1 + 0.2 * s.chainN; }
        const kv = S.kickVec(W, s, ang, true), ka = Math.atan2(kv[1], kv[0]);
        s.vx += kv[0]; s.vy += kv[1];
        // Double Fling (an upgrade): the first fling of a pass leaves the window open for one more
        s.kickCd = M.doubleFling && !s.dbl ? 0.05 : S.KICK_CD;
        s.dbl = M.doubleFling ? !s.dbl : false;
        if (M.recycle && s.probesLeft < M.probes && s.probes.length) { s.probesLeft++; ev && ev('probeBack', { n: s.probesLeft }); }
        if (M.flingFuel) s.fuel = Math.min(W.fuelMax, s.fuel + M.flingFuel);
        if (M.flingGuard) s.guard = M.flingGuard;
        ev && ev('perfect', { x: s.x, y: s.y, ang: ka, body: win });
      } else if (M.anyFling) {
        // Free Fling (an upgrade): a weaker fling anywhere, gold window or not
        const kv = S.kickVec(W, s, ang, true);
        s.vx += kv[0] * M.anyFling; s.vy += kv[1] * M.anyFling;
        s.kickCd = S.KICK_CD * 1.5;
        ev && ev('kick', { x: s.x, y: s.y, ang: Math.atan2(kv[1], kv[0]) });
      } else {
        // off the gold span the kick has nothing to push against: it fizzles (no cost, short lockout)
        s.kickCd = S.KICK_CD * 0.5;

    } else s.kickBuf -= dt;
  }
  // bounds — the survey field's containment: a springy rail (bank shots keep their speed)
  if (S.kin(W, s, s.burning, dt, _bn) === 1) {
    // the containment field charges for the bounce — unless this plate's walls are rails
    // one charge per contact: a ship pinned against the wall (or scraping along it) pays once, not every tick
    const pay = !W.rails && !(s.wallCd > 0);
    if (pay) s.pen += W.wallPen;
    s.wallCd = 0.4;
    ev && ev('bounce', { x: s.x, y: s.y, nx: _bn[0], ny: _bn[1], pen: pay ? W.wallPen : 0 });

  // probes: dropped where you are with your velocity, then pure ballistics — they map what they cross

    s.probesLeft--;
    if (W.mods.twinProbe) {

      for (const a of [-0.21, 0.21]) { const c = Math.cos(a), sn = Math.sin(a); s.probes.push({ x: s.x, y: s.y, vx: s.vx * c - s.vy * sn, vy: s.vx * sn + s.vy * c, age: 0, alive: true, orbit: -1 }); }
    } else s.probes.push({ x: s.x, y: s.y, vx: s.vx, vy: s.vy, age: 0, alive: true, orbit: -1 });

  }

  // bodies: horizons, surveys, grazes, white-hole surfaces
  for (let i = 0; i < W.bodies.length; i++) {
    const b = W.bodies[i];
    const dx = s.x - b.x, dy = s.y - b.y;
    const r = Math.hypot(dx, dy);
    if (b.type === 'white') {
      if (r < b.rh) {
        const nx = dx / r, ny = dy / r;
        s.x = b.x + nx * b.rh; s.y = b.y + ny * b.rh;
        const vn = s.vx * nx + s.vy * ny;
        if (vn < 0) { s.vx -= S.BUMPER * vn * nx; s.vy -= S.BUMPER * vn * ny; }

        ev && ev('bounce', { x: s.x, y: s.y, nx, ny, white: i });
        if (b.scan && !s.charted[i]) {
          s.charted[i] = true; s.litN[i] = b.need;

        }
      }
      continue;
    }
    if (r < b.rhNow * S.LETHAL) {

      }

        const byGuard = s.guard > 0, byShield = !byGuard && s.shield > 0;
        if (byGuard) s.guard = 0; else if (byShield) { s.shield--; if (M.bouncePen) s.pen += M.bouncePen; } else s.fuel -= M.hull;   // runs: a safety-field bounce costs time
        // ablative shield: thrown clear of the horizon once
        const nx = dx / r, ny = dy / r;
        s.x = b.x + nx * b.rhNow * 2.2; s.y = b.y + ny * b.rhNow * 2.2;
        const vn = s.vx * nx + s.vy * ny;
        s.vx -= 1.6 * vn * nx; s.vy -= 1.6 * vn * ny;
        { const out = Math.sqrt(S.vCirc2(b.mNow, b.rhNow * 2.2)) * 0.9; s.vx += nx * out; s.vy += ny * out; }
        ev && ev('shield', { body: i, x: s.x, y: s.y, hull: !byShield && !byGuard, guard: byGuard });
        continue;
      }
      s.alive = false; s.dead = { body: i, x: s.x, y: s.y };

    }
    // ergosphere: ride with the spin and the hole pays you (a Penrose-process nod)
    if (b.spin && r < b.ergo) {
      const vt = (-dy * s.vx + dx * s.vy) / r * Math.sign(b.spin);
      if (vt > 80) {
        const before = s.fuel;
        s.fuel = Math.min(W.fuelMax, s.fuel + S.ERGO_FUEL * Math.abs(b.spin) * dt);
        if (ev && s.tick % 12 === 0 && s.fuel > before) ev('harvest', { body: i, x: s.x, y: s.y });
      }
    }
    // photon graze
    const gz = b.type === 'pulsar' ? b.rh * 3.2 : b.rhNow * S.GRAZE;
    if (r < gz) { if (s.graze[i] === 0) s.graze[i] = 1; }
    else if (r > gz * 1.25) {
      if (s.graze[i] === 1) {
        s.fuel = Math.min(W.fuelMax, s.fuel + S.GRAZE_FUEL * M.graze);

      }
      s.graze[i] = 0;
    }

    if (b.scan && !s.charted[i] && r < b.scanR) {
      S.paint(b, s.lit[i], dx, dy, r, (seg) => {
        s.litN[i]++;
        if (s.charted[i]) return;

        ev && ev('segment', { body: i, seg, n: s.litN[i], need: b.need });
        if (s.litN[i] >= b.need) {

          s.fuel = Math.min(W.fuelMax, s.fuel + M.chartFuel);

    const dx = s.x - rk.x, dy = s.y - rk.y, d2 = dx * dx + dy * dy, rr = rk.size + 5;
    if (d2 < rr * rr) {

      // a tax, not a trap: fuel and clock, never your line (slowing beside a horizon kills)
      const d = Math.sqrt(d2) || 1, nx = dx / d, ny = dy / d;
      s.pen += S.ROCK_PEN;

  }

  if (s.worm > 0) s.worm -= dt;
  else {
    for (let i = 0; i < W.worms.length; i++) {
      const w = W.worms[i];
      for (const [A, Bm] of [[w.a, w.b], [w.b, w.a]]) {
        const dx = s.x - A.x, dy = s.y - A.y;
        if (dx * dx + dy * dy < w.r * w.r) {
          const fx = s.x, fy = s.y;
          s.x = Bm.x + dx; s.y = Bm.y + dy;
          s.worm = 0.35; s.wormFrom = [A.x, A.y];

        }

      if (s.worm > 0) break;
    }
  }

  if (!s.gateOpen && (W.needCharts ? s.charted.filter((c, i) => c && W.bodies[i].scan).length >= W.needCharts : s.charted.every(Boolean))) { s.gateOpen = true; ev && ev('gate', { x: W.gate.x, y: W.gate.y }); }

    if (dx * dx + dy * dy < W.gate.r * W.gate.r) {

  }
};

const _pp = [0, 0, 0];
S.stepProbes = (W, s, ev) => {
  const dt = S.DT, M = W.mods, life = S.PROBE_LIFE * (M.probeLife || 1);
  for (let pi = 0; pi < s.probes.length; pi++) {
    const p = s.probes[pi];
    if (!p.alive) continue;
    p.age += dt;
    if (p.age > life) { p.alive = false; ev && ev('probeEnd', { x: p.x, y: p.y, i: pi }); continue; }
    S.field(W, p.x, p.y, s.t, _pp);
    p.vx += _pp[0] * dt; p.vy += _pp[1] * dt;
    // orbit lock (an upgrade): inside an unmapped ring the probe holds a circular orbit and sweeps it
    if (p.orbit >= 0) {
      const b = W.bodies[p.orbit];
      if (s.charted[p.orbit]) p.orbit = -1;
      else {
        const dx = p.x - b.x, dy = p.y - b.y, r = Math.hypot(dx, dy) || 1;
        // spiral in to a deep circular orbit (where the brush is wide) over half a second
        p.orr += (P.clamp(b.scanR * 0.55, b.rhNow * 2.6, b.scanR) - p.orr) * Math.min(1, dt * 4);
        const rr = p.orr, sg = p.dir;
        const v = Math.sqrt(S.vCirc2(b.mNow, rr));
        p.vx = (-dy / r) * v * sg; p.vy = (dx / r) * v * sg;
        const ang = Math.atan2(dy, dx) + (v / rr) * dt * sg;
        p.x = b.x + Math.cos(ang) * rr; p.y = b.y + Math.sin(ang) * rr;
      }
    } else { p.x += p.vx * dt; p.y += p.vy * dt; }
    const B = W.bounds;
    if (p.x < B.x0 || p.x > B.x1 || p.y < B.y0 || p.y > B.y1) { p.alive = false; ev && ev('probeEnd', { x: p.x, y: p.y, i: pi, out: true }); continue; }
    if (M.scavenger) for (let ci = 0; ci < W.chips.length; ci++) {
      if (s.chips[ci]) continue;
      const c = W.chips[ci];
      if ((p.x - c.x) ** 2 + (p.y - c.y) ** 2 < 60 * 60) { s.chips[ci] = 1; s.chipN++; ev && ev('chip', { i: ci, x: c.x, y: c.y }); }
    }
    for (let i = 0; i < W.bodies.length; i++) {
      const b = W.bodies[i];
      const dx = p.x - b.x, dy = p.y - b.y, r = Math.hypot(dx, dy);
      if (b.type === 'white') {
        if (r < b.rh) {
          const nx = dx / r, ny = dy / r, vn = p.vx * nx + p.vy * ny;
          p.x = b.x + nx * b.rh; p.y = b.y + ny * b.rh;
          if (vn < 0) { p.vx -= S.BUMPER * vn * nx; p.vy -= S.BUMPER * vn * ny; }
          if (b.scan && !s.charted[i]) { s.charted[i] = true; s.litN[i] = b.need; ev && ev('charted', { body: i, x: b.x, y: b.y, tag: true, probe: true }); }
        }
        continue;
      }
      if (r < b.rhNow * S.LETHAL) { p.alive = false; ev && ev('probeEnd', { x: p.x, y: p.y, i: pi, body: i }); break; }
      if (b.scan && !s.charted[i] && r < b.scanR) {
        if (M.probeOrbit && p.orbit < 0 && r > b.rhNow * 2) { p.orbit = i; p.orr = r; p.dir = Math.sign(dx * p.vy - dy * p.vx) || 1; ev && ev('probeLock', { body: i, x: p.x, y: p.y }); }
        S.paint(b, s.lit[i], dx, dy, r, (seg) => {
          s.litN[i]++;
          if (s.charted[i]) return;
          ev && ev('segment', { body: i, seg, n: s.litN[i], need: b.need, probe: pi });
          if (s.litN[i] >= b.need) {
            s.charted[i] = true;
            if (M.chartProbe && s.probesLeft < M.probes) { s.probesLeft++; ev && ev('probeBack', { n: s.probesLeft }); }
            ev && ev('charted', { body: i, x: b.x, y: b.y, probe: true });
          }
        }, M.probeBrush || S.PROBE_BRUSH);
      }
    }
  }
};

// Has the ship done route step `it`? (a well index: charted; [x, y, r]: been there — where a
// point on a white hole means bouncing off it, and a point on a throat mouth means going through)
S.routeDone = (W, s, it) => {
  if (typeof it === 'number') return !!s.charted[it];
  if (!Array.isArray(it)) return false;
  const r = it[2] || 150;
  for (let i = 0; i < W.bodies.length; i++) {
    const b = W.bodies[i];
    if (b.type === 'white' && Math.hypot(b.x - it[0], b.y - it[1]) < b.rh + 20) return !!s.touched[i];
  }
  if (s.wormFrom && Math.hypot(s.wormFrom[0] - it[0], s.wormFrom[1] - it[1]) < r + 20) return true;
  return Math.hypot(s.x - it[0], s.y - it[1]) < r;
};

// ---------------------------------------------------------------- coast prediction
// Coasts forward (no input) from a copy of the ship. Writes points into buf (flat x,y).
// Returns {n, hit, peris, bounces, jumps, rock, lit, win, winAt}: winAt is the ship state where
// the first periapsis window opens (where a buffered kick would fire) — the fling preview starts there.
const _pf = [0, 0, 0];
const _ps = { x: 0, y: 0, vx: 0, vy: 0 };
S.predict = (W, s0, seconds, buf, every = 2) => {
  const st = _ps; st.x = s0.x; st.y = s0.y; st.vx = s0.vx; st.vy = s0.vy;
  let t = s0.t;
  const steps = Math.floor(seconds * S.HZ);
  let n = 0;
  const res = { n: 0, hit: -1, peris: [], bounces: [], bounce: -1, jumps: [], rock: -1, lit: W.bodies.map((b, i) => (b.scan && !s0.charted[i] ? s0.lit[i].slice() : null)), win: [], winAt: null };
  let inWin = false;
  let wcd = s0.worm > 0 ? s0.worm : 0;
  const lastR = new Float64Array(W.bodies.length).fill(1e9);
  const lastDr = new Float64Array(W.bodies.length).fill(-1);
  buf[n * 2] = st.x; buf[n * 2 + 1] = st.y; n++;
  const cap = buf.length / 2 - 4;
  for (let k = 1; k <= steps && n < cap; k++) {
    S.place(W, t);
    S.field(W, st.x, st.y, t, _pf);
    if (W.gateTow && s0.gateOpen) { const gx = W.gate.x - st.x, gy = W.gate.y - st.y, gd = Math.hypot(gx, gy) || 1; if (gd < W.gateTowR) { const k = W.gateTow * (1 - gd / W.gateTowR); _pf[0] += (gx / gd) * k; _pf[1] += (gy / gd) * k; } if (gd < Math.min(400, W.gateTowR)) { const nx = gx / gd, ny = gy / gd, vn = st.vx * nx + st.vy * ny, tx = st.vx - vn * nx, ty = st.vy - vn * ny, dmp = 3 * (1 - gd / Math.min(400, W.gateTowR)); _pf[0] -= tx * dmp; _pf[1] -= ty * dmp; } }
    st.vx += _pf[0] * S.DT; st.vy += _pf[1] * S.DT;
    const bounced = S.kin(W, st, false, S.DT, null);
    t += S.DT;
    const x = st.x, y = st.y;
    if (bounced === 2) { res.jumps.push(n); buf[n * 2] = x; buf[n * 2 + 1] = y; n++; }
    else if (bounced) { buf[n * 2] = x; buf[n * 2 + 1] = y; res.bounces.push(n); if (res.bounce < 0) res.bounce = n; n++; }
    if (wcd > 0) wcd -= S.DT;
    else for (const w of W.worms) {
      let A = null, Bm = null;
      if ((x - w.a.x) ** 2 + (y - w.a.y) ** 2 < w.r * w.r) { A = w.a; Bm = w.b; }
      else if ((x - w.b.x) ** 2 + (y - w.b.y) ** 2 < w.r * w.r) { A = w.b; Bm = w.a; }
      if (A) {
        buf[n * 2] = x; buf[n * 2 + 1] = y; n++;
        st.x = Bm.x + (x - A.x); st.y = Bm.y + (y - A.y); wcd = 0.35;
        res.jumps.push(n);
        buf[n * 2] = st.x; buf[n * 2 + 1] = st.y; n++;
        break;
      }
    }
    let dead = false;
    for (let i = 0; i < W.bodies.length; i++) {
      const b = W.bodies[i];
      const dx = st.x - b.x, dy = st.y - b.y;
      const r = Math.hypot(dx, dy);
      if (b.type === 'white') {
        if (r < b.rh) {
          // the white hole's surface throws you back out (same as the sim)
          const nx = dx / r, ny = dy / r, vn = st.vx * nx + st.vy * ny;
          st.x = b.x + nx * b.rh; st.y = b.y + ny * b.rh;
          if (vn < 0) { st.vx -= S.BUMPER * vn * nx; st.vy -= S.BUMPER * vn * ny; }
          res.bounces.push(n); if (res.bounce < 0) res.bounce = n;

'use strict';
// Particles, shockwaves, screen trauma, hit-stop, flashes, floating text.
// All of this is presentation — it runs on (dilated) real time and never feeds back into the sim.
P.FX = () => {
  const N = 6000;
  const F = {
    x: new Float32Array(N), y: new Float32Array(N), vx: new Float32Array(N), vy: new Float32Array(N),
    life: new Float32Array(N), max: new Float32Array(N), s0: new Float32Array(N), s1: new Float32Array(N),
    r: new Float32Array(N), g: new Float32Array(N), b: new Float32Array(N), a: new Float32Array(N),
    drag: new Float32Array(N), grav: new Float32Array(N), layer: new Uint8Array(N), stretch: new Float32Array(N),
    n: 0, cursor: 0,
    waves: [],        // {x,y,r,vr,life,max,col,width,screen}
    texts: [],        // {x,y,text,life,max,col,size,style}
    trauma: 0, hitstop: 0, flash: [0, 0, 0, 0], ca: 0, slowmo: 0, slowmoT: 0,
  };

    const i = F.cursor; F.cursor = (F.cursor + 1) % N; if (F.n < N) F.n++;
    F.x[i] = x; F.y[i] = y; F.vx[i] = vx; F.vy[i] = vy; F.life[i] = life; F.max[i] = life;
    F.s0[i] = s0; F.s1[i] = s1; F.r[i] = col[0]; F.g[i] = col[1]; F.b[i] = col[2]; F.a[i] = a;
    F.drag[i] = opts.drag == null ? 1.5 : opts.drag; F.grav[i] = opts.grav || 0; F.layer[i] = opts.world ? 1 : 0;
    F.stretch[i] = opts.stretch || 0;
  };
  F.burst = (x, y, n, speed, life, size, col, a, opts = {}) => {
    const spread = opts.spread == null ? P.TAU : opts.spread, dir = opts.dir || 0;
    for (let k = 0; k < n; k++) {
      const ang = dir + (Math.random() - 0.5) * spread;
      const sp = speed * (0.35 + Math.random() * 0.65);
      F.spawn(x, y, Math.cos(ang) * sp + (opts.vx || 0), Math.sin(ang) * sp + (opts.vy || 0),
        life * (0.6 + Math.random() * 0.4), size * (0.6 + Math.random() * 0.6), opts.s1 == null ? 0 : opts.s1, col, a, opts);
    }
  };
  F.wave = (x, y, r1, life, col, width = 0.12, screen = 0) => F.waves.push({ x, y, r: 0, r1, life, max: life, col, width, screen });
  F.text = (x, y, text, col, opts = {}) => {
    // merge with a callout that just appeared nearby: "periapsis · graze" instead of a stack
    // one word at a time in any spot: a new callout replaces whatever was still showing nearby
    F.texts = F.texts.filter((t) => Math.hypot(t.x - x, t.y - y) > 420 && !(t.follow && opts.follow));
    F.texts.push({ x, y, y0: y, follow: !!opts.follow, text, col, life: opts.life || 1.1, max: opts.life || 1.1, size: opts.size || 26, style: opts.style || 'serif', vy: opts.vy == null ? -28 : opts.vy });

  const _f = [0, 0, 0];
  F.update = (dt, W, t) => {
    for (let i = 0; i < F.n; i++) {
      if (F.life[i] <= 0) continue;
      F.life[i] -= dt;
      if (F.grav[i] && W) {
        P.Sim.field(W, F.x[i], F.y[i], t, _f);

      if (F.life[i] <= 0 || F.layer[i] !== layer) continue;

      const s = F.s1[i] + (F.s0[i] - F.s1[i]) * k;
      const a = F.a[i] * Math.min(1, k * 2.2);
      if (F.stretch[i]) {
        const sp = Math.hypot(F.vx[i], F.vy[i]);
        const L = Math.max(s, sp * F.stretch[i]);
        R.sprite(0, F.x[i], F.y[i], L, s, Math.atan2(F.vy[i], F.vx[i]), F.r[i], F.g[i], F.b[i], a, 3);
      } else R.sprite(0, F.x[i], F.y[i], s, s, 0, F.r[i], F.g[i], F.b[i], a, 3.5);
    }
    if (layer === 0) for (const w of F.waves) {
      const k = w.life / w.max;
      R.sprite(6, w.x, w.y, w.r + 1, w.r + 1, 0, w.col[0], w.col[1], w.col[2], k * k, w.width);
    }
  };
  return F;
};

'use strict';
// Critically-damped follow camera with velocity lookahead, objective framing, speed zoom,
// and trauma-based shake (Perlin-ish, not white noise — shakes should feel like weight).
P.Camera = () => {
  const C = { x: 0, y: 0, zoom: 1, vx: 0, vy: 0, vz: 0, tx: 0, ty: 0, tz: 1, shakeX: 0, shakeY: 0, t: 0 };
  const spring = (x, v, target, w, dt) => {
    // critically damped spring (exact for constant target)
    const f = 1 + 2 * dt * w, oo = w * w, hoo = dt * oo, hhoo = dt * hoo;
    const det = 1 / (f + hhoo);
    const nx = det * (f * x + dt * v + hhoo * target);
    const nv = det * (v + hoo * (target - x));
    return [nx, nv];
  };

  C.update = (dt, stiff = 5.5, zstiff = 3.2) => {
    [C.x, C.vx] = spring(C.x, C.vx, C.tx, stiff, dt);
    [C.y, C.vy] = spring(C.y, C.vy, C.ty, stiff, dt);
    // zoom in log space so in/out feel symmetric
    const lz = Math.log(C.zoom);
    const [nz, nv] = spring(lz, C.vz, Math.log(C.tz), zstiff, dt);
    C.zoom = Math.exp(nz); C.vz = nv;
    C.t += dt;
  };

  };

};

    const la = P.lerp(0.42, 0.15, nearK);
    let tx = s.x + P.clamp(s.vx * la, -460, 460), ty = s.y + P.clamp(s.vy * la, -320, 320);
    if (near) { tx = P.lerp(tx, near.x, nearK * 0.5); ty = P.lerp(ty, near.y, nearK * 0.5); }
    // keep the next objective in frame: you should always see where you're going next
    if (!opts.menu && pl.phase !== 'done') {
      let obj = null, od = 1e9;
      if (s.gateOpen) obj = { x: W.gate.x, y: W.gate.y, r: W.gate.r };
      else W.bodies.forEach((b, i) => {
        if (!b.scan || s.charted[i]) return;
        const d = Math.hypot(b.x - s.x, b.y - s.y) - b.scanR;
        if (d > b.scanR * 0.2 && d < od) { od = d; obj = { x: b.x, y: b.y, r: b.scanR }; }
      });
      if (obj && Math.hypot(obj.x - s.x, obj.y - s.y) < 2600) {
        tx = P.lerp(tx, (s.x + obj.x) / 2, 0.4); ty = P.lerp(ty, (s.y + obj.y) / 2, 0.4);
        const hwN = Math.max(Math.abs(s.x - tx) + 220, Math.abs(obj.x - tx) + obj.r + 90);
        const hhN = Math.max(Math.abs(s.y - ty) + 180, Math.abs(obj.y - ty) + obj.r + 90);
        // fit inside what the HUD leaves free (title and clock up top, fuel at the bottom)
        const fit = Math.min((R.w / 2 - 60 * R.dpr) / hwN, (R.h / 2 - 125 * R.dpr) / hhN);
        tz = Math.max(Math.min(tz, fit), base * 0.62);
      }
    }
    if (pl.phase === 'rewind' || pl.phase === 'dying') { tx = s.x; ty = s.y; }

    const intro = (pl.firstEntry || pl.retryView) && pl.readyT < (pl.retryView ? 0.7 : 1.0) && !pl.launched;
    const peek = !opts.menu && I.down('KeyQ', 'Tab');
    if (intro || peek) { tz = fitZoom(); tx = (B.x0 + B.x1) / 2; ty = (B.y0 + B.y1) / 2; if (pl.retryView && !pl.retrySnap) { pl.retrySnap = true; cam.snap(tx, ty, tz); } }
    else pl.firstEntry = false;
    // keep the frame on the plate
    const margin = 180;
    const hw = R.w / 2 / tz, hh = R.h / 2 / tz;
    const clampAxis = (v, a0, a1, h, m0 = margin, m1 = margin) => (a1 - a0 + m0 + m1 < 2 * h ? (a0 + a1) / 2 + (m1 - m0) / 2 : P.clamp(v, a0 - m0 + h, a1 + m1 - h));
    // the HUD bands (title and clock up top, fuel and keys below) never sit over the board: the camera keeps that much room past the walls
    const mTop = opts.menu || opts.attract ? margin : Math.max(margin, (140 * R.dpr) / tz), mBot = opts.menu || opts.attract ? margin : Math.max(margin, (100 * R.dpr) / tz);
    tx = clampAxis(tx, B.x0, B.x1, hw); ty = clampAxis(ty, B.y0, B.y1, hh, mTop, mBot);
    // parked above the level card (bottom of the screen): keep the ship in the upper 60%
    if (pl.phase === 'ready' && !pl.launched && !opts.menu && !opts.attract && !intro) {
      const sy = (s.y - ty) * tz + R.h / 2;
      if (sy > R.h * 0.58) ty += (sy - R.h * 0.58) / tz;
    }
    if (pl.phase === 'done') {
      if (def.finale != null) { const b = W.bodies[def.finale]; tz = cam.zoom * (1 + dt * (0.5 + pl.doneT * 0.9)); tx = b.x; ty = b.y; }
      else { tz = cam.tz * (1 + dt * 0.2); tx = W.gate.x; ty = W.gate.y; }
    }
    if (opts.menu) {
      const c = opts.menu.cam, base = Math.min(R.h / 1250, R.w / 2050);
      tx = c[0] + Math.sin(pl.realT * 0.05) * 60; ty = c[1] + Math.cos(pl.realT * 0.04) * 40; tz = base * c[2];
      if (pl.realT < 0.05) cam.snap(tx, ty, tz);
    }
    if (G.qs.get('cam')) { const c = G.qs.get('cam').split(',').map(Number); tx = c[0]; ty = c[1]; tz = c[2]; cam.snap(tx, ty, tz); }
    if (opts.attract) { tx -= (R.w * 0.2) / tz; }
    // while you hold the mouse to steer, the zoom holds still, so the cursor keeps pointing where you meant
    if (pl.phase === 'fly' && I.mdown[0] && !opts.menu && !opts.attract) tz = cam.tz;
    // a scripted camera for the trailer (tools/trailer.py sets G.cine; play never does)
    if (G.cine) { const c = G.cine({ tx, ty, tz, base, s, W, menu: !!opts.menu }); if (c) { tx = c.tx; ty = c.ty; tz = c.tz; } }
    cam.tx = tx; cam.ty = ty; cam.tz = tz;
    if (!opts.menu && !opts.attract && G.hud && G.hud.veil) {
      const pts = [[s.x, s.y, 20]];
      W.bodies.forEach((b) => pts.push([b.x, b.y, b.type === 'white' ? 30 : (b.scanR || 40) * 0.5]));
      if (W.gate) pts.push([W.gate.x, W.gate.y, W.gate.r]);
      const css = R.dpr || 1, under = { tl: false, tr: false, b: false };
      for (const [x, y, r] of pts) {
        const sx = ((x - cam.x) * cam.zoom + R.w / 2) / css, sy = ((y - cam.y) * cam.zoom + R.h / 2) / css, rr = (r * cam.zoom) / css;
        const W_ = R.w / css, H_ = R.h / css;
        if (sx - rr < 400 && sy - rr < 150) under.tl = true;
        if (sx + rr > W_ - 300 && sy - rr < 150) under.tr = true;
        if (sy + rr > H_ - 96 && Math.abs(sx - W_ / 2) < 240 + rr) under.b = true;
      }
      G.hud.veil(under);
    }
    cam.update(dt, pl.phase === 'rewind' ? 12 : intro ? 2.2 : 3.0, intro ? 1.5 : 0.9);
  };

  const finish = () => {
    if (!pl.auto && !opts.menu && !opts.attract) P.Save.flag('finishes', (P.Save.flag('finishes') || 0) + 1);
    const t = pl.s.t + pl.s.pen;
    pl.result = { time: t, inputs: pl.rec.slice(0, pl.recN), route: route.slice(), routeBurn: routeBurn.slice(), routeSpd: routeSpd.slice(), perfects: perfects.slice(), splits: pl.splits.slice(), attempts: pl.attempts, fuel: pl.s.fuel, chips: pl.s.chipN, walls: +(pl.wallPen || 0).toFixed(1), skims: pl.skims || 0, arcs: pl.arcs || 0, probeMaps: pl.probeMaps || 0, probesUsed: (W.mods.probes || 0) - pl.s.probesLeft };
    if (def.finale != null) { fx.slow(0.6, 1.4); fx.shake(0.4); fx.ca = 1.2; }
    else { fx.flashC(P.hex('#FFFFFF'), 0.1); fx.shake(0.3); fx.slow(0.6, 0.6); }
    fx.wave(W.gate.x, W.gate.y, 420, 1.2, P.hex('#FFFFFF', 2), 0.05);
    G.waves.push({ x: W.gate.x, y: W.gate.y, r: 0, life: 0.8, max: 0.8, s: 1.4 });
    A() && A().finish();
    pl.cancelFinish = false;
    const res = pl.result;
    opts.onSubmit && opts.onSubmit(res);
    opts.onFinish && setTimeout(() => { if (!pl.cancelFinish && G.scene === pl) opts.onFinish(res); }, def.finale != null ? 1700 : 650);
  };

  // ---------------------------------------------------------------- draw
  pl.draw = (ink) => {
    const s = pl.s, t = pl.s.t, rt = pl.realT;
    const view = cam.view(fx.trauma, G.settings.shake);
    R.begin(view, rt);
    const z = view.zoom, px = 1 / z;
    S.place(W, s.t);
    const holes = [];

    // ======== WORLD (lensed) ========
    R.layer('world');
    R.blend('add');
    for (let i = 0; i < W.bodies.length; i++) {
      const b = W.bodies[i];
      const bd = def.bodies[i];
      if (b.type === 'hole') {
        const temp = bd.temp || 6200;
        const glowC = P.blackbody(temp);
        if (!bd.quiet) {
          const rOut = b.rhNow * (bd.disk ? bd.disk * 0.65 : 2.0);
          R.sprite(7, b.x, b.y, rOut, rOut, 0, 1.0, 0.95, 0.9, bd.diskA ? bd.diskA * 0.7 : 0.48, (b.rhNow * S.LETHAL * 1.08) / rOut, 1.6 * (b.spin ? 1 + Math.abs(b.spin) * 1.5 : 1) * (b.spin < 0 ? -1 : 1), temp, Math.abs(b.spin) * 0.6, i * 3.7 + seedBg);
          R.glow(b.x, b.y, rOut * 1.5, glowC, 0.06, 3);
        }
        const fall = pl.phase === 'done' && def.finale === i ? pl.doneT : 0;
        holes.push({ x: b.x, y: b.y, shadow: b.rhNow * S.LETHAL * (1 + fall * fall * 0.35), einstein: b.rhNow * (1.05 + fall * 1.4), col: [glowC[0] * 1.4, glowC[1] * 1.3, glowC[2] * 1.2], ring: fall > 0 ? 1.2 : 0 });
      } else if (b.type === 'pulsar') {
        const c = P.hex('#BFE3FF', 1);
        R.glow(b.x, b.y, 110, P.hex('#6FB6FF'), 0.14, 3);
        R.sprite(8, b.x, b.y, 80, 80, S.beamAngle(b, t), 0.8, 1.3, 2.4, 1, 4, S.beamAngle(b, t));
        holes.push({ x: b.x, y: b.y, shadow: 0.01, einstein: b.rh * 1.2, col: [0, 0, 0], ring: 0 });
      } else if (b.type === 'white') {
        const c = P.hex('#FFF1DC', 1);
        R.glow(b.x, b.y, b.rh * 3.0, P.hex('#FFB27A'), 0.22, 2.5);
        R.glow(b.x, b.y, b.rh * 1.5, c, 0.6, 2);
        R.disc(b.x, b.y, b.rh, P.hex('#FFF6EA', 1.45), 1);
      }
    }
    for (const w of W.worms) {
      for (const [p, sgn] of [[w.a, 1], [w.b, -1]]) {
        R.sprite(7, p.x, p.y, w.r * 2.4, w.r * 2.4, 0, 0.75, 0.9, 1.2, 0.9, 0.22, 2.4 * sgn, 13000, 0, 7.7 + sgn);
        R.glow(p.x, p.y, w.r * 3.2, P.hex('#7FB8E6'), 0.12, 2.5);
        holes.push({ x: p.x, y: p.y, shadow: w.r * 0.32, einstein: w.r * 0.95, col: [0.6, 0.85, 1.3], ring: 0.9 });
      }
    }
    fx.draw(R, 1);

    // ======== OVER (instrument) ========
    R.layer('over');
    R.blend('alpha');
    drawBounds(z);
    R.blend('add');
    for (let i = 0; i < W.bodies.length; i++) drawBodyInstrument(i, z, rt);
    drawRocks(z, rt);
    drawCells(z, rt);
    drawChips(z, rt);
    drawWorms(z, rt);
    drawGate(z, rt);
    if (ghost && (pl.phase === 'fly' || pl.phase === 'ready')) drawGhost(z);
    if (pl.phase === 'fly' || pl.phase === 'ready') drawPrediction(z, rt); else { pl.predCharts = []; pl.peLabels = []; }
    // the predictor (and the fling preview, which predicts from a future moment) leaves the bodies
    // placed at some other time — put them back to now before anything else reads them
    S.place(W, s.t);
    drawTrail(z);
    drawProbes(z, rt);
    fx.draw(R, 0);
    drawShip(z, rt);
    if (!opts.menu && !opts.attract) drawIndicators(z, rt);

    // post
    const waves = G.waves.map((w) => ({ x: w.x, y: w.y, r: w.r, s: (w.life / w.max) * w.s }));
    const speed = Math.hypot(s.vx, s.vy);
    const dying = pl.phase === 'dying' ? P.clamp(pl.deathT / 0.6, 0, 1) : 0;
    const rew = pl.phase === 'rewind' ? Math.sin(P.clamp(pl.rewindT / 0.22, 0, 1) * Math.PI) : 0;
    R.end({
      bg: { tintA, tintB, seed: seedBg, neb: field.neb == null ? 0.55 : field.neb, reseau: 0, core: coreBg, stars: opts.menu || opts.attract ? 1 : 0 },   // no stars in flight: nothing drifts that means nothing
      field: fieldEnv(),
      holes,
      post: {
        bloom: 0.65, bloomThresh: 0.75, exposure: 1.0,
        ca: (fx.ca * 0.25 + rew * 0.9 + dying * 0.4) * G.settings.fxScale,   // gentle: strong fringing splits stars into RGB specks
        // no grain in flight: nothing should shimmer over the board
        grain: (opts.menu || opts.attract ? 0.026 : 0) + rew * 0.08, vig: 0.42 + pl.focus * 0.35 + (pl.dangerSlow || 0) * 0.25 + dying * 0.3,
        flash: finaleWhite() > fx.flash[3] ? [1, 0.95, 0.86, finaleWhite()] : [fx.flash[0], fx.flash[1], fx.flash[2], fx.flash[3] * G.settings.flashScale],
        desat: pl.focus * 0.35 + rew * 0.6 + dying * 0.4, fade: 0, waves,
      },
    });

    // ======== INK ========
    drawInk(ink, z, rt);
  };

  // the gravity map: every body's pull, drawn as contour lines (see P.SH.fieldFrag)
  const PROBE_C = P.hex('#7FE0FF', 1.5);
  const CONTOUR = P.CONTOUR;
  const CONTOUR_K = { VI: 1.2, VIII: 1.15 };
  const FIELD_COLD = P.hex(CONTOUR[field.id] || CONTOUR.I, 0.9 * (CONTOUR_K[field.id] || 1)), FIELD_WARM = P.hex('#E8DCC8', 1.0), FIELD_HOT = P.hex('#FF6A2A', 1.7), FIELD_GOLD = P.hex('#E6E0D2', 0.9);
  const fieldEnv = () => {
    const bodies = [];
    for (let i = 0; i < W.bodies.length; i++) {
      const b = W.bodies[i];
      bodies.push({ x: b.x, y: b.y, m: b.mNow, sign: b.type === 'white' ? -S.WHITE_G : 1, rh: b.rhNow, charted: pl.s.charted[i], lit: pl.s.winNow === i ? 1 : 0 });
    }
    return { bodies, fall: S.FALL, R0: S.R0, step: opts.menu || opts.attract ? 0.075 : 0.1, str: opts.menu ? 0.7 : 0.72, cold: FIELD_COLD, warm: FIELD_WARM, hot: FIELD_HOT, gold: FIELD_GOLD };
  };
  const finaleWhite = () => (def.finale != null && pl.phase === 'done' ? 0.3 * P.smooth(P.clamp((pl.doneT - 0.6) / 1.0, 0, 1)) : 0);
  const drawBounds = (z) => {
    // the containment field: invisible until you approach it, then a hatched wall
    const B = W.bounds, s = pl.s;
    if (W.mods.wrap) {   // Phase Drive: the edge is a seam, not a wall
      R.blend('alpha');
      R.line([B.x0, B.y0, B.x1, B.y0, B.x1, B.y1, B.x0, B.y1, B.x0, B.y0], 5, { width: 1.2, col: P.hex('#7FE0FF'), alpha: 0.3, dash: 12 / z, duty: 0.4 });
      R.blend('add');
      return;
    }
    const flash = Math.max(0, 1 - (pl.realT - (pl.bounceT || -9)) / 0.5);
    const edges = [[B.x0, B.y0, B.x1, B.y0, s.y - B.y0, 0, 1], [B.x1, B.y0, B.x1, B.y1, B.x1 - s.x, -1, 0], [B.x1, B.y1, B.x0, B.y1, B.y1 - s.y, 0, -1], [B.x0, B.y1, B.x0, B.y0, s.x - B.x0, 1, 0]];
    // rails (springy, free) read as gold; a plain containment field charges time and reads warm red
    const wc = W.rails ? COL.gold : P.hex('#9FB4D0');   // steel: walls cost time, they don't kill; red is kept for horizons
    for (const [x0, y0, x1, y1, d, nx, ny] of edges) {
      const near = P.clamp(1 - d / 520, 0, 1);
      const a = (W.rails ? 0.3 : 0.36) + 0.5 * near * near + flash * 0.6;
      R.line([x0, y0, x1, y1], 2, { width: W.rails ? 1.8 : 1.8, col: wc, alpha: a });
      if (a > 0.2) {
        // hatch marks pointing inward
        const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len, step = 26 / z + 10;
        const cx = P.clamp((s.x - x0) * ux + (s.y - y0) * uy, 0, len);
        for (let t = Math.max(0, cx - 700); t < Math.min(len, cx + 700); t += step) {
          const fall = 1 - Math.abs(t - cx) / 700;
          const px = x0 + ux * t, py = y0 + uy * t;
          R.line([px, py, px + nx * 9 / z + ux * 6 / z, py + ny * 9 / z + uy * 6 / z], 2, { width: 1, col: wc, alpha: a * fall * 0.8 });
        }
      }
    }
  };

  const drawBodyInstrument = (i, z, rt) => {
    const b = W.bodies[i], s = pl.s;
    const px = 1 / z;
    if (b.orbit) {
      const o = b.orbit;
      let cx = o.cx || 0, cy = o.cy || 0;
      if (o.around != null) { cx = W.bodies[o.around].x; cy = W.bodies[o.around].y; }
      R.blend('alpha');
      if (o.rx || o.ry) {
        const pts = new Float32Array(2 * 161), q = [0, 0];
        for (let k = 0; k <= 160; k++) { S.orbitAt(o, cx, cy, (k / 160) * P.TAU, q); pts[k * 2] = q[0]; pts[k * 2 + 1] = q[1]; }
        R.line(pts, 161, { width: 1, col: COL.bone, alpha: s.charted[i] ? 0.04 : 0.09, dash: 9 * px, duty: 0.45 });
      } else if (!s.charted[i]) R.circle(cx, cy, o.r, { width: 1, col: COL.bone, alpha: 0.07, dash: 9 * px, duty: 0.45 }, 128);
      R.blend('add');
    }
    if (b.type === 'white') {
      R.ring(b.x, b.y, b.rh + 2 * px, 1.2, P.hex('#FFD9B0'), 0.6);
      R.sprite(10, b.x, b.y, b.rh * 1.5, b.rh * 1.5, 0, 1, 0.85, 0.7, 0.35, 1, 36, rt * 0.02, 0.5);
      if (b.scan) {
        // a tag bumper: charted by bouncing off it — a turning gold dial until you do
        const done = s.charted[i], kt = rt - pl.chartT[i];
        if (!done) {
          R.ring(b.x, b.y, b.rh * 1.42, 2.2, P.hex('#F2C46D', 1.5), 0.85);
          R.sprite(12, b.x, b.y, b.rh * 1.7, b.rh * 1.7, 0, 1.9, 1.5, 0.75, 0.9, 16, 0.16, 2, rt * 0.08);
        } else R.ring(b.x, b.y, b.rh * 1.42, 1.6, P.hex('#F2C46D', 1.1 + (kt < 0.5 ? 1.5 * (1 - kt / 0.5) : 0)), 0.7);
      }
      return;
    }
    if (b.type === 'hole') drawHorizon(b, i, z, rt);
    if (b.type === 'pulsar') drawBeams(b, rt);
    if (b.spin) {
      const dir = b.spin > 0 ? 1 : -1;
      R.sprite(10, b.x, b.y, b.ergo, b.ergo, 0, 0.6, 0.85, 1, 0.5, 1.2, 28, -dir * rt * 0.12 * Math.abs(b.spin), 0.35);
      // two curved arrows riding the dashed ring, turning with the spin (clockwise on screen = positive)
      for (let k = 0; k < 2; k++) {
        const a0 = dir * rt * 0.6 * Math.abs(b.spin) + k * Math.PI, rr = b.ergo * 1.12, span = 0.9;
        const pts = [];
        for (let q = 0; q <= 12; q++) { const aa = a0 + dir * span * (q / 12); pts.push(b.x + Math.cos(aa) * rr, b.y + Math.sin(aa) * rr); }
        R.line(pts, 13, { width: 2.2, col: [0.75, 1.0, 1.35], alpha: 0.85 });
        const ae = a0 + dir * span, tx = -Math.sin(ae) * dir, ty = Math.cos(ae) * dir, hx = b.x + Math.cos(ae) * rr, hy = b.y + Math.sin(ae) * rr, L = 8 / z;
        R.line([hx - tx * L + Math.cos(ae) * L * 0.6, hy - ty * L + Math.sin(ae) * L * 0.6, hx, hy, hx - tx * L - Math.cos(ae) * L * 0.6, hy - ty * L - Math.sin(ae) * L * 0.6], 3, { width: 2.2, col: [0.75, 1.0, 1.35], alpha: 0.85 });
      }
    }
    if (!b.scan) {
      if (def.bodies[i].decor) {
        R.sprite(12, b.x, b.y, b.scanR + 6 * px, b.scanR + 6 * px, 0, 1, 1, 1, 0.3, 72, (6 * px) / (b.scanR + 6 * px), 1, rt * 0.004);
        R.sprite(10, b.x, b.y, b.scanR * 1.6, b.scanR * 1.6, 0, 1, 1, 1, 0.12, 1, 120, -rt * 0.002, 0.5);
        R.ring(b.x, b.y, b.scanR, 1, P.hex('#F2C46D', 1.2), 0.5);
      }
      return;
    }
    const charted = s.charted[i];
    const kt = rt - pl.chartT[i];
    // survey ring: lit mask
    let lo = 0, hi = 0;
    const lit = s.lit[i];
    for (let k = 0; k < b.N; k++) if (lit[k] || charted) { if (k < 24) lo += 2 ** k; else hi += 2 ** (k - 24); }
    const pulse = charted ? 0.6 + 0.4 * Math.exp(-kt * 2.5) : 1;
    const inside = !charted && Math.hypot(s.x - b.x, s.y - b.y) < b.scanR;
    const col = charted ? P.hex('#F2C46D', 1.25 * pulse + (kt < 0.5 ? 1.5 * (1 - kt / 0.5) : 0)) : P.hex('#F2C46D', 1.6);
    // unlit slots read as bone-ish empty arcs; lit arcs are crisp gold
    // unmapped: the target — a bright segmented gold ring with a slow breathing halo
    if (!charted) { const br = 0.5 + 0.5 * Math.sin(rt * 2.2 + i), c2 = P.hex('#F2C46D', 1.2); R.sprite(6, b.x, b.y, b.scanR * 1.08, b.scanR * 1.08, 0, c2[0], c2[1], c2[2], 0.14 + 0.1 * br, 0.09); }
    if (charted) R.circle(b.x, b.y, b.scanR, { width: 1.4, col: P.hex('#F2C46D', 1.1), alpha: 0.35 + 0.5 * Math.exp(-kt * 2.5) }, 160);   // mapped: one quiet solid line, unlike the dashed rings still to do
    else R.sprite(3, b.x, b.y, b.scanR, b.scanR, 0, col[0], col[1], col[2], 1, charted ? 1.6 : (inside ? 3.6 : 3.2), b.N, lo, hi, 2.6, inside ? 0.6 : 0.5, 1, charted ? 1 : (inside ? 0.95 : 0.85));
    if (inside) {
      R.ring(b.x, b.y, b.scanR + 5 / z, 1, COL.bone, 0.35);
      // the survey brush: how much of the ring this depth paints at once
      const r = Math.hypot(s.x - b.x, s.y - b.y), a = Math.atan2(s.y - b.y, s.x - b.x);

'use strict';
// Synthesized audio: SFX + adaptive score. Everything is generated with WebAudio nodes —
// no samples. The score is a lookahead sequencer whose layers fade with flight intensity;
// it never restarts on retry (flow first). Charting plucks are keyed to the current track.
P.Audio = (G) => {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  const ctx = new AC({ latencyHint: 'interactive' });
  const A = { ctx, ready: false };
  const now = () => ctx.currentTime;

  // ---------------------------------------------------------------- graph
  const master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.18;
  master.connect(comp); comp.connect(ctx.destination);
  A.tap = () => comp;
  const musicBus = ctx.createGain(); musicBus.gain.value = G.settings.music;
  const musicLP = ctx.createBiquadFilter(); musicLP.type = 'lowpass'; musicLP.frequency.value = 20000; musicLP.Q.value = 0.5;
  musicBus.connect(musicLP); musicLP.connect(master);
  const sfxBus = ctx.createGain(); sfxBus.gain.value = G.settings.sfx;
  sfxBus.connect(master);

  // reverb (generated IR) + tempo delay
  const mkIR = (secs, decay) => {
    const len = Math.floor(ctx.sampleRate * secs), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) { const t = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (t < 0.01 ? t / 0.01 : 1); }
    }
    return b;
  };
  const verb = ctx.createConvolver(); verb.buffer = mkIR(3.4, 3.2);
  const verbIn = ctx.createGain(); verbIn.gain.value = 1;
  const verbOut = ctx.createGain(); verbOut.gain.value = 0.55;
  verbIn.connect(verb); verb.connect(verbOut); verbOut.connect(master);
  const delay = ctx.createDelay(2); delay.delayTime.value = 0.375;
  const fb = ctx.createGain(); fb.gain.value = 0.38;
  const dLP = ctx.createBiquadFilter(); dLP.type = 'lowpass'; dLP.frequency.value = 3200;
  const delayIn = ctx.createGain(); const delayOut = ctx.createGain(); delayOut.gain.value = 0.5;
  delayIn.connect(delay); delay.connect(dLP); dLP.connect(fb); fb.connect(delay); dLP.connect(delayOut); delayOut.connect(master); delayOut.connect(verbIn);

  const noiseBuf = (() => { const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; })();
  const shaper = (amt) => { const ws = ctx.createWaveShaper(); const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = (i / n) * 2 - 1; c[i] = Math.tanh(x * amt); } ws.curve = c; return ws; };

  const env = (g, t, a, peak, d, sus, rel, len) => {

    g.setTargetAtTime(sus * peak, t + a, d / 3);

    duck: ctx.createGain(),
  };
  mus.duck.connect(musicBus);
  for (const k in mus.layer) { mus.layer[k].gain.value = 0; mus.layer[k].connect(k === 'drums' || k === 'pad' ? musicBus : mus.duck); }
  const LAYER_AT = { pad: 0, bass: 1, drums: 2, arp: 3, lead: 4 };

    const sc = SC[tr.scale]; const n = sc.length;

// ever stored — the inputs are the record).

  const c = P._routeCache[def.id];
  if (c && c.key === rec.ghost) return c.route;
  const inp = P.Save.ghost(def.id);
  if (!inp) return null;
  const route = P._replayRoute(def, inp);
  P._routeCache[def.id] = { key: rec.ghost, route };
  return route;
};
P._replayRoute = (def, inp) => {
  const W = P.Sim.build(def), s = P.Sim.newShip(W), out = [s.x, s.y];
  for (let k = 0; k < inp.length && s.alive && !s.done; k++) {
    const v = inp[k];
    P.Sim.step(W, s, P.Sim.decode(v), null);
    if (s.tick % 10 === 0) out.push(s.x, s.y);
  }
  return out;
};

P.lacunaFinalSVG = () => {

  let svg = P.lacunaSVG(-1, info);
  const L = P.lacunaLayout();

  P.FIELDS.forEach((f, fi) => f.plates.forEach((def, k) => {
    const r = P.routeFromGhost(def); if (!r) return;
    const B = def.bounds, st = L.fields[fi].stars[k];

    for (let i = 0; i < r.length; i += 2) d += (i ? 'L' : 'M') + (st[0] + (r[i] - (B.x0 + B.x1) / 2) * sc).toFixed(1) + ' ' + (st[1] + (r[i + 1] - (B.y0 + B.y1) / 2) * sc).toFixed(1);
    const m = info[fi].medals[k];

P.savePlatePNG = (svg, title, sub, fname) => {

  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H + lab);
  const img = new Image();
  // an SVG loaded as an image sees none of the page CSS: carry the chart's styling inside it
  const css = `<style>.lc-hit{fill:none}.lc-sel{fill:none;stroke:none}.lc-con{fill:none;stroke:#ECE5D6;stroke-opacity:.3;stroke-width:1}
    .lc-star{fill:#ECE5D6}.lc-star.shut{fill-opacity:.25}.lc-star.open{fill:#05060a;stroke:#ECE5D6;stroke-width:1.2}.lc-star.gold{fill:#F2C46D}.lc-star.ace{fill:#FF5A1F}
    .lc-halo{fill:none;stroke-width:1;stroke-opacity:.45}.lc-halo.gold{stroke:#F2C46D}.lc-halo.ace{stroke:#FF5A1F}
    .lc-num{font:italic 34px Georgia,serif;fill:rgba(236,229,214,.6)}.lc-name{font:500 13px Helvetica,Arial,sans-serif;letter-spacing:2.5px;fill:rgba(236,229,214,.45)}
    .lc-core{fill:none}.lc-probe{fill:none}</style>`;
  const fixed = svg.replace(/data-f(?!=)/g, 'data-f=""').replace(/(<svg[^>]*>)/, '$1' + css);
  const blob = new Blob([fixed.replace('<svg ', '<svg width="' + W + '" height="' + H + '" ')], { type: 'image/svg+xml' });

    ctx.drawImage(img, 0, 0, W, H);
    ctx.fillStyle = '#E8E1D1'; ctx.fillRect(0, H, W, lab);
    ctx.fillStyle = '#17150F';
    ctx.font = '600 26px "Sora"'; ctx.fillText(sub.toUpperCase(), 60, H + 62);
    ctx.font = '700 60px "Sora"'; ctx.fillText(title, 60, H + 124);
    ctx.font = '500 22px "Sora"'; ctx.textAlign = 'right'; ctx.fillText('PERIAPSIS', W - 60, H + 120);

  };
  img.onerror = () => { URL.revokeObjectURL(url); console.warn('plate export failed'); };
  img.src = url;
};

      const pay = N.fly ? `<div class="ri-pay"><span>pays</span><b class="tier gold">gold ${Math.round(RN.MEDAL_PAY[3] * mult)}</b><b class="tier silver">silver ${Math.round(RN.MEDAL_PAY[2] * mult)}</b><b class="tier bronze">bronze ${Math.round(RN.MEDAL_PAY[1] * mult)}</b></div>` : '';
      info.innerHTML = `<div class="kicker">${esc(N.name)}${n.cond ? ' · ' + RN.CONDS[n.cond].name : ''}</div><h3>${n.type === 'boss' ? esc(RN.bossName(run, n.zone)) : esc(N.name)}</h3><p>${esc(N.desc)}</p>${n.cond ? `<p class="ri-cond"><b class="c-${n.cond}">${RN.CONDS[n.cond].name}</b> ${esc(RN.CONDS[n.cond].desc)}</p>` : ''}${pay}<div class="ri-thumb ${N.fly ? '' : 'pic'}">${N.fly ? '<div class="ri-wait">charting the sector…</div>' : `<svg viewBox="-60 -40 120 80">${NODE_ICON[n.type]}</svg>`}</div><div class="ri-tags"></div>`;
